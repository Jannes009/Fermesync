<div class="sd-container" id="cost-adjustment-root">
    <h2 class="sd-title">Cost Adjustment</h2>

    <div class="sd-form">
        <div class="sd-field full-width">
            <label for="ca_product">Product</label>
            <select id="ca_product" class="sd-select"></select>
        </div>

        <div id="ca_cost_info" class="sd-summary full-width">
            <div class="sd-summary-item">
                <span class="sd-summary-label">Current Cost</span>
                <span class="sd-summary-value" id="ca_current_cost">—</span>
            </div>
        </div>

        <div class="sd-field full-width">
            <label for="ca_cost">New Cost</label>
            <input id="ca_cost" class="sd-input" type="number" step="0.0001" min="0" placeholder="0.0000" disabled>
        </div>

        <div class="sd-actions full-width">
            <button id="ca_submit" class="sd-btn" type="button" disabled>Update Cost</button>
        </div>
    </div>

    <div id="ca_result" class="sd-result"></div>
</div>
