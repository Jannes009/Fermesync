{% extends 'inventory_base.html' %}
{% block content %}
    <style>
        * { box-sizing: border-box; }
        body {
            background: var(--primary-bg);
            color: var(--primary-text);
            font-size: 0.95rem;
            margin: 0; padding: 0;
            min-height: 100vh;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem;
        }

        .card {
            background: var(--container-bg);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 6px rgba(44,62,80,0.08);
        }

        .dashboard-panel {
            padding: 1.5rem;
        }

        .panel-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .panel-header p {
            margin: 0;
            color: var(--muted-text, #7b8a99);
            font-size: 0.95rem;
        }

        .panel-header-actions {
            margin-top: 1rem;
        }

        @media(min-width:768px){
            .panel-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .panel-header-actions {
                margin-top: 0;
            }
        }

        .btn-primary {
            background: var(--button-bg); color: var(--button-text);
            border: none; padding: 12px 16px;
            border-radius: 8px; cursor: pointer; font-size: 1rem;
        }

        .section-title-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.5rem;
            align-items: baseline;
            margin-bottom: 0.75rem;
        }

        .section-title-row h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .issue-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .issue-filters label {
            display: grid;
            gap: 0.3rem;
            color: var(--muted-text, #65737e);
            font-size: 0.85rem;
        }

        .issue-filters input, .issue-filters select {
            min-height: 40px;
            padding: 0.45rem 0.6rem;
            color: var(--primary-text);
            background: var(--form-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
        }

        .table-scroll { overflow-x: auto; }
        .issues-table { width: 100%; border-collapse: collapse; min-width: 780px; }
        .issues-table th, .issues-table td {
            padding: 0.7rem;
            border-bottom: 1px solid var(--input-border);
            text-align: left;
            vertical-align: middle;
        }
        .issues-table th { font-size: 0.82rem; color: var(--muted-text, #65737e); }
        .issue-status { font-weight: 600; }
        .issue-status-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .issue-status-badge.cancelled {
            color: #8f2119;
            background: #fde8e6;
            border-color: #e7aaa5;
        }
        .issue-actions { display: flex; gap: 0.5rem; }
        .issue-actions a, .issue-actions button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 0.4rem 0.65rem;
            border: 1px solid var(--button-bg);
            border-radius: 4px;
            color: var(--button-bg);
            background: transparent;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .issue-actions .receive-issue {
            color: var(--button-text);
            background: var(--button-bg);
        }
    </style>

<div class="wrap with-fixed-taskbar">

    <div id="overview-panel" class="card dashboard-panel">
        <div class="panel-header">
            <div>
                <h1>Stock Issues</h1>
            </div>
            <div class="panel-header-actions">
                {% if can_create %}
                <button id="new-issue-btn" class="btn-primary">
                    + Start New Stock Issue
                </button>
                {% endif %}
            </div>
        </div>

        <div class="panel-section">
            {% if can_view %}
            <div class="issue-filters" aria-label="Stock issue filters">
                <label>Status
                    <select id="issue-status-filter">
                        <option value="all">Outstanding and recent</option>
                        <option value="outstanding">Outstanding only</option>
                        <option value="finalised">Finalised only</option>
                    </select>
                </label>
                <label>From
                    <input id="issue-from-filter" type="date">
                </label>
                <label>To
                    <input id="issue-to-filter" type="date">
                </label>
                <button id="apply-issue-filters" class="btn-primary" type="button">Apply filters</button>
            </div>
            {% endif %}
            <div class="table-scroll">
                <table class="issues-table">
                    <thead>
                        <tr>
                            <th>Issue</th>
                            <th>Issued</th>
                            <th>Status</th>
                            <th>Warehouse</th>
                            <th>Execution</th>
                            <th>Evolution reference</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stock-issues-body">
                        <tr><td colspan="7">Loading issues...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<script>
  window.FERMESYNC = {
    userId: {{ current_user.id | tojson }},
    permissions: {{ current_user.permissions | tojson }}
  };
</script>
<script src="{{ url_for('inventory.static',
    filename='stock_issue/stock_issue_list.js') }}?v={{ filemtime('inventory','stock_issue/stock_issue_list.js') }}">
</script>

<script>
document.getElementById("new-issue-btn")?.addEventListener("click", () => {
    window.location.href = '/inventory/SDK/stock_issue_wizard';
});
</script>
{% endblock %}
