{% extends 'inventory_base.html' %}
{% block content %}
<style>
.detail-shell{max-width:1000px;margin:0 auto;padding:1.25rem}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.detail-head h1{margin:0}.detail-head-actions{display:flex;gap:.6rem;align-items:center}.detail-panel{background:var(--container-bg);padding:1rem;border-radius:8px;margin:1rem 0;box-shadow:0 1px 6px rgba(0,0,0,.08)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.detail-label{display:block;color:var(--secondary-text);font-size:.8rem;font-weight:600}.detail-value{display:block;margin-top:.2rem}.detail-line{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--input-border)}.detail-line:last-child{border-bottom:0}.detail-actions{display:flex;gap:.6rem;flex-wrap:wrap}.detail-btn{padding:.65rem 1rem;border:0;border-radius:6px;background:var(--button-bg);color:var(--button-text);font-weight:600;text-decoration:none;cursor:pointer}.detail-btn.secondary{background:#6c757d;color:#fff}.detail-action-menu{position:relative;display:inline-block}.detail-action-items{display:none;position:absolute;right:0;top:calc(100% + .25rem);z-index:10;min-width:9rem;padding:.25rem;background:var(--container-bg);border:1px solid var(--input-border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15)}.detail-action-menu.open .detail-action-items{display:grid}.detail-action-item{border:0;background:transparent;color:var(--primary-text);padding:.55rem .7rem;text-align:left;cursor:pointer;border-radius:4px;white-space:nowrap}.detail-action-item:hover{background:var(--form-bg)}.muted{color:var(--secondary-text)}@media(max-width:700px){.detail-grid,.detail-line{grid-template-columns:1fr}.detail-actions{flex-direction:column}.detail-head-actions{flex-wrap:wrap;justify-content:flex-end}.detail-btn{text-align:center}}@media print{.taskbar,.detail-head-actions .secondary,#actions{display:none!important}.with-fixed-taskbar{margin-top:0!important}.detail-shell{max-width:none;padding:0}.detail-panel{box-shadow:none;border:1px solid #bbb;break-inside:avoid}body{background:#fff;color:#000}.detail-label,.muted{color:#444}}
</style>
<style>
.print-slip-header{display:none}
@media print{
  .detail-head{display:none!important}
  #history{display:none!important}
  #history-panel{display:none!important}
  .print-slip-header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:0 0 1rem;margin-bottom:1rem;border-bottom:3px solid #2b6cb0}
  .print-slip-brand{width:180px;height:52px;object-fit:contain;object-position:left center}
  .print-slip-uitdraai{width:150px;height:58px;object-fit:contain;object-position:right center}
  .print-slip-title{flex:1;text-align:center;color:#2b3e51}
  .print-slip-title h1{margin:0;font-size:1.45rem}
  .print-slip-title p{margin:.25rem 0 0;color:#4a5568;font-size:.85rem}
  .detail-panel{background:#fff;border:1px solid #cbd5e1!important;border-radius:4px!important;padding:.8rem!important;margin:.75rem 0!important}
  .detail-panel h2{color:#2b6cb0;font-size:1rem;margin:.1rem 0 .6rem;border-bottom:1px solid #cbd5e1;padding-bottom:.35rem}
  .detail-line{grid-template-columns:2fr 1fr!important;padding:.55rem 0;border-bottom:1px solid #e2e8f0}
  .detail-line span:nth-child(3){display:none}
  .detail-label{color:#4a5568}
  .detail-shell{font-size:.9rem}
  .print-slip-header + #message{display:none!important}
}
</style>
<style>
  .detail-shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem;
    color: var(--primary-text);
    background: var(--container-bg);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(44, 62, 80, 0.08);
  }
  .detail-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--table-border);
  }
  .detail-head h1 { margin: 0; font-size: 1.5rem; }
  .detail-head-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .detail-btn { min-height: 40px; padding: 0.55rem 0.9rem; border-radius: 5px; }
  .detail-panel {
    margin: 0;
    padding: 1.25rem 0;
    background: transparent;
    border-bottom: 1px solid var(--table-border);
    border-radius: 0;
    box-shadow: none;
  }
  #detail > .detail-panel:last-of-type { border-bottom: 0; }
  .detail-panel h2 { margin: 0 0 0.85rem; font-size: 1.1rem; }
  .detail-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem 1.5rem; }
  .detail-label { margin-bottom: 0.2rem; color: var(--secondary-text); font-size: 0.8rem; }
  .detail-value { color: var(--primary-text); font-weight: 600; overflow-wrap: anywhere; }
  #status { display: inline-flex; align-items: center; width: fit-content; padding: 0.25rem 0.65rem; border: 1px solid var(--input-border); border-radius: 4px; background: var(--table-header-bg); color: var(--table-header-text); font-size: 0.78rem; font-weight: 700; }
  .detail-line { grid-template-columns: minmax(0, 2fr) minmax(130px, 1fr) minmax(190px, 1.2fr); align-items: center; gap: 1rem; padding: 0.8rem 0; border-bottom-color: var(--table-border); }
  .detail-line span:first-child { color: var(--primary-text); font-weight: 600; }
  .detail-line span:nth-child(2), .detail-line span:nth-child(3) { color: var(--secondary-text); font-size: 0.88rem; }
  .detail-actions { padding: 1rem 0; }
  .detail-actions:empty { display: none; }
  .ibt-action-link { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0.55rem 0.9rem; border: 0; border-radius: 5px; color: var(--button-text); background: var(--button-bg); font-weight: 600; text-decoration: none; cursor: pointer; }
  .ibt-action-link:hover { background: var(--button-hover); }
  .ibt-history-list { display: grid; gap: 0; margin: 0; padding: 0 0 0 1rem; list-style: none; border-left: 2px solid var(--input-border); }
  .ibt-history-event { position: relative; display: grid; grid-template-columns: minmax(155px, 220px) 1fr; gap: 0.75rem; padding: 0.25rem 0 1rem 1rem; }
  .ibt-history-event::before { position: absolute; top: 0.35rem; left: -1.36rem; width: 8px; height: 8px; border: 2px solid var(--container-bg); border-radius: 50%; background: var(--button-bg); content: ""; }
  .ibt-history-event time { color: var(--secondary-text); font-size: 0.88rem; }
  .ibt-history-event strong { font-weight: 700; }
  .ibt-history-reason { display: block; margin-top: 0.25rem; color: var(--secondary-text); }
  .muted { color: var(--secondary-text); }
  @media (max-width: 640px) {
    .detail-shell { padding: 0.75rem; }
    .detail-head-actions { width: 100%; }
    .detail-head-actions .detail-btn { flex: 1; text-align: center; }
    .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .detail-line { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem 0.75rem; margin-bottom: 0.5rem; padding: 0.75rem; border: 1px solid var(--table-border); border-radius: 5px; background: var(--container-bg); }
    .detail-line span:first-child { grid-column: 1 / -1; padding-bottom: 0.45rem; border-bottom: 1px solid var(--table-border); }
    .detail-line span:nth-child(2), .detail-line span:nth-child(3) { min-width: 0; overflow-wrap: anywhere; }
    .ibt-history-event { grid-template-columns: 1fr; gap: 0.2rem; }
  }
  @media print {
    .detail-shell { max-width: none; padding: 0; box-shadow: none; }
    .detail-head { display: none !important; }
    #actions, #history-panel { display: none !important; }
    .detail-panel { padding: 0.8rem 0; border-bottom: 0; }
    .detail-line { grid-template-columns: 2fr 1fr !important; }
    .detail-line span:nth-child(3) { display: none; }
  }
</style>
<div class="print-slip-header" aria-hidden="true">
  <img class="print-slip-brand" src="{{ url_for('static', filename='icons/HorizontalLogoAndText.svg') }}" alt="Fermesync">
  <div class="print-slip-title"><h1 id="print-slip-number"></h1></div>
  <img class="print-slip-uitdraai" src="{{ url_for('static', filename='icons/UitdraaiLogo.jpeg') }}" alt="Uitdraai">
</div>
<div class="detail-shell"><div class="detail-head"><h1 id="title">IBT Detail</h1><div class="detail-head-actions"><button id="print-btn" class="detail-btn" type="button" hidden><i class="fas fa-print" aria-hidden="true"></i> Print picking slip</button><a class="detail-btn secondary" href="/inventory/SDK/IBT">Back</a></div></div><div id="message" class="detail-panel muted">Loading...</div><div id="detail" hidden><div class="detail-panel"><div class="detail-grid"><div><span class="detail-label">From</span><span id="from" class="detail-value"></span></div><div><span class="detail-label">To</span><span id="to" class="detail-value"></span></div><div><span class="detail-label">Status</span><span id="status" class="detail-value"></span></div><div><span class="detail-label">Requested</span><span id="requested" class="detail-value"></span></div></div></div><div class="detail-panel"><h2>Products</h2><div id="lines"></div></div><div id="history-panel" class="detail-panel"><h2>History</h2><div id="history" class="detail-grid"></div></div><div id="actions" class="detail-actions"></div></div></div>
<script>
window.IBT_PERMISSIONS={{ permissions|tojson }};
window.IBT_WAREHOUSES={{ current_user.warehouses|tojson }};
</script>
<script>
(() => {
  const id = new URLSearchParams(location.search).get('ibt_no') || new URLSearchParams(location.search).get('ibt_id');
  const permissions = window.IBT_PERMISSIONS || [];
  const userWarehouses = new Set((window.IBT_WAREHOUSES || []).map(value => String(value)));
  const allowed = name => permissions.includes(`IBT_${name}`);
  const message = document.getElementById('message');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = value => value ? new Date(value).toLocaleString() : '—';
  const load = async () => {
    if (!id) throw new Error('No IBT was selected.');
    const response = await request(`/inventory/ibt/detail/${encodeURIComponent(id)}`);
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || 'Unable to load IBT.');
    const ibt = data.ibt;
    const ownsSource = userWarehouses.has(String(ibt.warehouse_from.id));
    const ownsDestination = userWarehouses.has(String(ibt.warehouse_to.id));
    document.getElementById('title').textContent = `IBT ${ibt.number}`;
    document.getElementById('print-slip-number').textContent = `IBT ${ibt.number}`;
    document.getElementById('from').textContent = ibt.warehouse_from.name;
    document.getElementById('to').textContent = ibt.warehouse_to.name;
    document.getElementById('status').textContent = ibt.status;
    document.getElementById('requested').textContent = date(ibt.request_timestamp);
    const printButton = document.getElementById('print-btn');
    printButton.hidden = ibt.status !== 'APPROVED' && ibt.status !== 'ISSUED';
    printButton.addEventListener('click', () => window.print());
    document.getElementById('lines').innerHTML = data.lines.map(line => `<div class="detail-line"><span>${esc(line.product_desc || line.product_id)}</span><span>Issued: ${line.qty ?? '—'} ${esc(line.stocking_unit_code || '—')}</span><span>Received: ${line.qty_received ?? '—'} ${esc(line.stocking_unit_code || '—')} | Variance: ${line.qty_variance ?? '—'} ${esc(line.stocking_unit_code || '—')}</span></div>`).join('');
    const historyEvents = [
      { label: 'Requested', timestamp: ibt.request_timestamp, user: ibt.request_user },
      { label: 'Approved', timestamp: ibt.approval_timestamp, user: ibt.approval_user },
      { label: 'Dispatched', timestamp: ibt.dispatch_timestamp, user: ibt.dispatch_user },
      { label: 'Received', timestamp: ibt.receive_timestamp, user: ibt.receive_user },
      { label: 'Rejected', timestamp: ibt.rejection_timestamp, user: ibt.rejection_user, reason: ibt.rejection_reason },
    ].filter(event => event.timestamp).sort((left, right) => new Date(left.timestamp) - new Date(right.timestamp));
    document.getElementById('history').className = 'ibt-history-list';
    document.getElementById('history').innerHTML = historyEvents.length
      ? historyEvents.map(event => `<li class="ibt-history-event"><time datetime="${esc(new Date(event.timestamp).toISOString())}">${esc(date(event.timestamp))}</time><div><strong>${esc(event.label)}</strong>${event.user ? ` by ${esc(event.user)}` : ''}${event.reason ? `<span class="ibt-history-reason">${esc(event.reason)}</span>` : ''}</div></li>`).join('')
      : '<li class="muted">No recorded activity.</li>';
    const actions = [];
    const reviewUrl = `/inventory/SDK/IBT_issue?ibt_no=${encodeURIComponent(ibt.number)}&step=3`;
    if ((ibt.status === 'REQUESTED' || ibt.status === 'REJECTED') && allowed('REQUEST') && ownsSource) actions.push(['Edit', reviewUrl]);
    if (ibt.status === 'REQUESTED' && allowed('APPROVE')) actions.push(['Approve', reviewUrl]);
    if (ibt.status === 'REQUESTED' && allowed('REJECT')) actions.push(['Reject', reviewUrl]);
    if (ibt.status === 'APPROVED' && allowed('APPROVE') && ownsSource) actions.push(['Edit', reviewUrl]);
    if (ibt.status === 'APPROVED' && allowed('ISSUE') && ownsSource) actions.push(['Issue stock', reviewUrl]);
    if (ibt.status === 'ISSUED' && allowed('RECEIVE') && ownsDestination) actions.push(['Receive', `/inventory/SDK/IBT_receive?ibt_no=${encodeURIComponent(ibt.number)}`]);
    const actionsContainer = document.getElementById('actions');
    actionsContainer.replaceChildren();
    actionsContainer.classList.add('detail-actions');
    for (const [label, href] of actions) {
      const actionLink = document.createElement('a');
      actionLink.className = 'ibt-action-link';
      actionLink.href = href;
      actionLink.textContent = label;
      actionsContainer.appendChild(actionLink);
    }
    message.hidden = true;
    document.getElementById('detail').hidden = false;
  };
  load().catch(error => {message.textContent=error.message;});
})();
</script>
{% endblock %}
