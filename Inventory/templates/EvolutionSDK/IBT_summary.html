{% extends 'inventory_base.html' %}
{% block content %}
<style>
.ibt-shell{max-width:1180px;margin:0 auto;padding:1.25rem}.ibt-toolbar{display:flex;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}.ibt-toolbar h1{margin:0}.ibt-btn{border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer;font-weight:600;background:var(--button-bg);color:var(--button-text)}.ibt-btn.secondary{background:#6c757d;color:#fff}.ibt-filter{padding:.65rem;border:1px solid var(--input-border);border-radius:6px;background:var(--form-bg)}.ibt-table{width:100%;border-collapse:collapse;background:var(--container-bg)}.ibt-table th,.ibt-table td{padding:.75rem;text-align:left;border-bottom:1px solid var(--input-border)}.ibt-table th{color:var(--secondary-text);font-size:.8rem}.ibt-row{cursor:pointer}.ibt-row:hover{background:var(--form-bg)}.ibt-status{display:inline-block;border-radius:999px;padding:.25rem .55rem;font-size:.78rem;font-weight:700}.status-REQUESTED{background:#fff3cd;color:#856404}.status-APPROVED{background:#d1ecf1;color:#0c5460}.status-ISSUED{background:#d4edda;color:#155724}.status-RECEIVED{background:#cfe2ff;color:#084298}.status-REJECTED{background:#f8d7da;color:#842029}@media(max-width:700px){.ibt-toolbar{align-items:stretch;flex-direction:column}.ibt-table{font-size:.85rem}.ibt-table th:nth-child(4),.ibt-table td:nth-child(4),.ibt-table th:nth-child(5),.ibt-table td:nth-child(5){display:none}}
</style>
<div class="ibt-shell">
  <div class="ibt-toolbar"><h1>Inter-Branch Transfers</h1>{% if "IBT_CREATE" in current_user.permissions and ("IBT_REQUEST" in current_user.permissions or "IBT_ISSUE" in current_user.permissions) %}<button class="ibt-btn" id="new-ibt">Create IBT</button>{% endif %}</div>
  <div style="display:flex;gap:.5rem;margin-bottom:1rem"><select id="status-filter" class="ibt-filter"><option value="">All statuses</option><option>REQUESTED</option><option>APPROVED</option><option>ISSUED</option><option>RECEIVED</option><option>REJECTED</option></select><button class="ibt-btn secondary" id="refresh-ibt">Refresh</button></div>
  <div id="ibt-list">Loading...</div>
</div>
<script>window.IBT_PERMISSIONS={{ permissions|tojson }};</script>
<script src="{{ url_for('inventory.static', filename='EvolutionSDK/IBT_summary.js') }}?{{ filemtime('inventory', 'EvolutionSDK/IBT_summary.js') }}"></script>
{% endblock %}
