{% extends 'inventory_base.html' %}
{% block content %}
<style>
.ibt-action-button{border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer;font-weight:600;background:var(--button-bg);color:var(--button-text)}.ibt-received-toggle{display:inline-flex;align-items:center;gap:.55rem;color:var(--secondary-text);font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap}.ibt-received-toggle input{position:absolute;opacity:0;pointer-events:none}.ibt-slider{position:relative;width:42px;height:24px;border-radius:999px;background:#cbd5e1;transition:background .2s}.ibt-slider::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}.ibt-received-toggle input:checked + .ibt-slider{background:var(--button-bg)}.ibt-received-toggle input:checked + .ibt-slider::after{transform:translateX(18px)}
.ibt-shell{max-width:1180px;margin:0 auto;padding:1.25rem}.ibt-toolbar{display:flex;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}.ibt-toolbar h1{margin:0}.ibt-btn,.ibt-action-menu-toggle{border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer;font-weight:600;background:var(--button-bg);color:var(--button-text)}.ibt-btn.secondary{background:#6c757d;color:#fff}.ibt-filter{padding:.65rem;border:1px solid var(--input-border);border-radius:6px;background:var(--form-bg)}.ibt-table{width:100%;border-collapse:collapse;background:var(--container-bg)}.ibt-table th,.ibt-table td{padding:.75rem;text-align:left;border-bottom:1px solid var(--input-border)}.ibt-table th{color:var(--secondary-text);font-size:.8rem}.ibt-row{cursor:pointer}.ibt-row:hover{background:var(--form-bg)}.ibt-status{display:inline-block;border-radius:999px;padding:.25rem .55rem;font-size:.78rem;font-weight:700}.status-REQUESTED{background:#fff3cd;color:#856404}.status-APPROVED{background:#d1ecf1;color:#0c5460}.status-ISSUED{background:#d4edda;color:#155724}.status-RECEIVED{background:#cfe2ff;color:#084298}.status-REJECTED{background:#f8d7da;color:#842029}.ibt-action-menu{position:relative;display:inline-block}.ibt-action-menu-items{display:none;position:absolute;right:0;top:calc(100% + .25rem);z-index:10;min-width:9rem;padding:.25rem;background:var(--container-bg);border:1px solid var(--input-border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15)}.ibt-action-menu.open .ibt-action-menu-items{display:grid}.ibt-action-item{border:0;background:transparent;color:var(--primary-text);padding:.55rem .7rem;text-align:left;cursor:pointer;border-radius:4px;white-space:nowrap}.ibt-action-item:hover{background:var(--form-bg)}@media(max-width:700px){.ibt-toolbar{align-items:stretch;flex-direction:column}.ibt-table{font-size:.85rem}.ibt-table th:nth-child(4),.ibt-table td:nth-child(4),.ibt-table th:nth-child(5),.ibt-table td:nth-child(5){display:none}}
</style>
<div class="ibt-shell">
  <div class="ibt-toolbar"><h1>Inter-Branch Transfers</h1>{% if ("IBT_REQUEST" in current_user.permissions) or "IBT_APPROVE" in current_user.permissions %}<button class="ibt-btn" id="new-ibt">New IBT</button>{% endif %}</div>
  <div style="display:flex;gap:.75rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap"><select id="status-filter" class="ibt-filter"><option value="">All statuses</option><option>REQUESTED</option><option>APPROVED</option><option>ISSUED</option><option>RECEIVED</option><option>REJECTED</option></select><label class="ibt-received-toggle" for="show-received"><input type="checkbox" id="show-received"><span class="ibt-slider" aria-hidden="true"></span><span>Show received IBTs</span></label><button class="ibt-btn secondary" id="refresh-ibt">Refresh</button></div>
  <div id="ibt-list">Loading...</div>
</div>
<script>window.IBT_PERMISSIONS={{ permissions|tojson }};</script>
<script src="{{ url_for('inventory.static', filename='EvolutionSDK/IBT_summary.js') }}?{{ filemtime('inventory', 'EvolutionSDK/IBT_summary.js') }}"></script>
{% endblock %}
