{% extends 'inventory_base.html' %}
{% block content %}
<style>
  .wrap { max-width: 1200px; margin: 1.2rem auto; padding: 0 1rem; }
  .card { padding: 1.5rem; border-radius: 12px; background: var(--container-bg); box-shadow: 0 1px 10px rgba(0,0,0,0.06); }
  .summary-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .summary-header h1 { margin: 0; font-size: 1.6rem; color: var(--primary-text); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 0.5rem; }
  .actions a { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 8px; background: #6c757d; color: white; text-decoration: none; font-size: 0.95rem; }
  .actions a:hover { background: #5a6268; }
  .actions button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--button-bg); color: var(--button-text); font-size: 0.95rem; cursor: pointer; }
  .actions button:disabled { opacity: 0.6; cursor: wait; }
  .refresh-status { align-self: center; color: var(--secondary-text); font-size: 0.85rem; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.25rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
  .filter-field { min-width: 180px; }
  .filter-field label { display: block; margin-bottom: 0.35rem; font-size: 0.8rem; color: var(--secondary-text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .filter-field select {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--form-bg);
    color: var(--primary-text);
    font-size: 0.95rem;
  }
  .toggle-wrap {
    display: flex; align-items: center; gap: 0.75rem;
    margin-left: auto;
  }
  .toggle-group {
    position: relative;
    display: inline-flex;
    gap: 0.25rem;
    background: var(--form-bg);
    border: 1px solid var(--input-border);
    border-radius: 999px;
    padding: 0.25rem;
  }
  .toggle-option {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 140px;
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--secondary-text);
    transition: all 0.2s ease;
  }
  .toggle-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .toggle-option.selected {
    background: var(--button-bg, #0d6efd);
    color: var(--button-text, #fff);
    box-shadow: 0 2px 8px rgba(13, 110, 253, 0.25);
  }
  .table-wrapper { margin-top: 1.25rem; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 940px; }
  th, td { padding: 12px 14px; border-bottom: 1px solid var(--input-border); text-align: left; font-size: 0.95rem; }
  th { background: var(--form-bg); color: var(--secondary-text); font-weight: 700; }
  .sort-button {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    width: 100%; padding: 12px 14px; border: 0; background: transparent;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  th { padding: 0; }
  .sort-button::after { content: "\2195"; opacity: 0.5; }
  th[aria-sort="ascending"] .sort-button::after { content: "\25B2"; opacity: 1; }
  th[aria-sort="descending"] .sort-button::after { content: "\25BC"; opacity: 1; }
  .sort-button:focus-visible { outline: 2px solid var(--button-bg, #0d6efd); outline-offset: -2px; }
  tbody tr.execution-row { transition: background 0.15s ease; cursor: pointer; }
  tbody tr.execution-row:hover { background: var(--form-bg); }
  .muted { color: var(--secondary-text); }
  .status-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 4px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; }
  .status-finalised { background: #d4edda; color: #155724; }
  .status-draft { background: #e2e3e5; color: #383d41; }
  .description-cell { max-width: 420px; }
  .description-text { display: inline-block; line-height: 1.45; }
  .no-data { padding: 18px 14px; font-style: italic; color: var(--secondary-text); }
  @media (max-width: 900px) {
    table { min-width: 100%; }
    .summary-header { flex-direction: column; }
    .actions { width: 100%; }
    .toolbar { align-items: stretch; }
    .toggle-wrap { width: 100%; justify-content: flex-start; }
  }
</style>

<div class="wrap">
  <div class="card">
    <div class="summary-header">
      <div>
        <h1>Spray Executions</h1>
      </div>
      <div class="actions">
        <a href="/agri/spray-recommendations-summary">Back to recommendations</a>
        <button id="refreshExecutionsButton" type="button" title="Refresh execution summaries">Refresh</button>
        <span id="execution-refresh-status" class="refresh-status" role="status"></span>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <div class="filter-field">
          <label for="weekFilter">Week</label>
          <select id="weekFilter">
            <option value="">All weeks</option>
            {% for week in week_filter_options %}
              <option value="{{ week }}">{{ week }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="filter-field">
          <label for="blockFilter">Block</label>
          <select id="blockFilter">
            <option value="">All blocks</option>
            {% for block_no in block_filter_options %}
              <option value="{{ block_no }}">{{ block_no }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="toggle-wrap">
        <div class="toggle-group" aria-label="Finalised execution visibility">
          <label class="toggle-option selected">
            <input type="radio" name="finalisedFilter" value="hide" checked>
            <span>Hide finalised</span>
          </label>
          <label class="toggle-option">
            <input type="radio" name="finalisedFilter" value="show">
            <span>Show all</span>
          </label>
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th scope="col" data-sort-type="text" aria-sort="none"><button class="sort-button" type="button">Spray No/s</button></th>
            <th scope="col" data-sort-type="text" aria-sort="none"><button class="sort-button" type="button">Description</button></th>
            <th scope="col" data-sort-type="date" aria-sort="none"><button class="sort-button" type="button">Date</button></th>
            <th scope="col" data-sort-type="text" aria-sort="none"><button class="sort-button" type="button">Responsible</button></th>
            <th scope="col" data-sort-type="percentage" aria-sort="none"><button class="sort-button" type="button">% Diff (Issued vs Rec.)</button></th>
            <th scope="col" data-sort-type="text" aria-sort="none"><button class="sort-button" type="button">Block</button></th>
            <th scope="col" data-sort-type="finalised" aria-sort="none"><button class="sort-button" type="button">Finalised</button></th>
          </tr>
        </thead>
        <tbody id="executionTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
window.sprayOfflineReady = new Promise(resolve => { window.resolveSprayOfflineReady = resolve; });
</script>
<script type="module" src="{{ url_for('agri.static', filename='SprayRecommendation/offline.js') }}?v={{ filemtime('agri','SprayRecommendation/offline.js') }}"></script>
<script>
const weekFilter = document.getElementById('weekFilter');
const blockFilter = document.getElementById('blockFilter');
const executionTableBody = document.getElementById('executionTableBody');
const finalisedOptions = document.querySelectorAll('input[name="finalisedFilter"]');
const sortCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

function sortExecutionRows(header) {
  const headers = Array.from(header.parentElement.children);
  const columnIndex = headers.indexOf(header);
  const direction = header.dataset.sortDirection === 'ascending' ? 'descending' : 'ascending';
  const sortDirection = direction === 'ascending' ? 1 : -1;
  const sortType = header.dataset.sortType;

  headers.forEach(cell => {
    cell.setAttribute('aria-sort', 'none');
    delete cell.dataset.sortDirection;
  });
  header.setAttribute('aria-sort', direction);
  header.dataset.sortDirection = direction;

  const rows = Array.from(executionTableBody.querySelectorAll('.execution-row'));
  rows.sort((left, right) => {
    const leftText = left.cells[columnIndex].textContent.trim();
    const rightText = right.cells[columnIndex].textContent.trim();
    if (sortType === 'percentage' && (!leftText || !rightText)) {
      return leftText ? -1 : rightText ? 1 : 0;
    }

    let comparison;
    if (sortType === 'percentage') {
      comparison = Number.parseFloat(leftText) - Number.parseFloat(rightText);
    } else if (sortType === 'finalised') {
      comparison = Number(left.dataset.finalised === 'true') - Number(right.dataset.finalised === 'true');
    } else {
      comparison = sortCollator.compare(leftText, rightText);
    }
    return comparison * sortDirection;
  });

  rows.forEach(row => executionTableBody.appendChild(row));
}

document.querySelectorAll('thead .sort-button').forEach(button => {
  button.addEventListener('click', () => sortExecutionRows(button.closest('th')));
});

function updateToggleSelection() {
  finalisedOptions.forEach(option => {
    const label = option.closest('.toggle-option');
    if (label) label.classList.toggle('selected', option.checked);
  });
}

function applyExecutionFilters() {
  const weekValue = weekFilter ? weekFilter.value : '';
  const blockValue = blockFilter ? blockFilter.value : '';
  const hideFinalised = document.querySelector('input[name="finalisedFilter"][value="hide"]')?.checked ?? true;

  document.querySelectorAll('.execution-row').forEach(row => {
    const rowWeek = (row.dataset.week || '').toLowerCase();
    const rowBlock = (row.dataset.block || '').toLowerCase();
    const rowFinalised = row.dataset.finalised === 'true';
    const matchesWeek = !weekValue || rowWeek.includes(weekValue.toLowerCase());
    const matchesBlock = !blockValue || rowBlock.includes(blockValue.toLowerCase());
    const matchesFinalised = !hideFinalised || !rowFinalised;

    row.style.display = matchesWeek && matchesBlock && matchesFinalised ? '' : 'none';
  });
}

function attachExecutionHandlers() {
  document.querySelectorAll('.execution-row').forEach(row => {
    row.addEventListener('click', () => {
      if (row.dataset.href) {
        window.location.href = row.dataset.href;
      }
    });
  });
}

function setFilterOptions(select, values, allLabel) {
  const selected = select.value;
  select.replaceChildren(new Option(allLabel, ''));
  [...new Set(values.filter(Boolean))].sort(sortCollator.compare).forEach(value => {
    select.appendChild(new Option(value, value));
  });
  if ([...select.options].some(option => option.value === selected)) select.value = selected;
}

function renderExecutions(records) {
  const rows = (records || []).map(record => record.detail).filter(Boolean);
  rows.sort((left, right) => (right.date || '').localeCompare(left.date || '') || Number(right.id) - Number(left.id));
  executionTableBody.replaceChildren();
  if (!rows.length) {
    const emptyRow = document.createElement('tr');
    const cell = emptyRow.insertCell();
    cell.colSpan = 7;
    cell.className = 'no-data';
    cell.textContent = 'No spray executions found.';
    executionTableBody.appendChild(emptyRow);
  }

  rows.forEach(execution => {
    const row = document.createElement('tr');
    row.className = 'execution-row';
    row.dataset.href = `/agri/execution/${execution.id}`;
    row.dataset.executionId = execution.id;
    row.dataset.finalised = String(Boolean(execution.finalised));
    row.dataset.week = execution.week_text || '-';
    row.dataset.block = execution.block_text || '-';
    row.dataset.description = execution.description || '-';
    row.insertCell().textContent = execution.spray_no || '-';
    const descriptionCell = row.insertCell();
    descriptionCell.className = 'description-cell';
    const description = document.createElement('span');
    description.className = 'description-text';
    description.textContent = execution.description || '-';
    descriptionCell.appendChild(description);
    row.insertCell().textContent = execution.date || '-';
    row.insertCell().textContent = execution.responsible_person || '-';
    row.insertCell().textContent = execution.qty_percent_diff ?? 'N/A';
    row.insertCell().textContent = execution.block_text || '-';
    const finalisedCell = row.insertCell();
    const status = document.createElement('span');
    status.className = `status-pill ${execution.finalised ? 'status-finalised' : 'status-draft'}`;
    status.textContent = execution.finalised ? 'Yes' : 'No';
    finalisedCell.appendChild(status);
    executionTableBody.appendChild(row);
  });

  setFilterOptions(weekFilter, rows.flatMap(row => (row.week_text || '').split(', ').filter(value => value && value !== '-')), 'All weeks');
  setFilterOptions(blockFilter, rows.flatMap(row => (row.block_text || '').split(', ').filter(value => value && value !== '-')), 'All blocks');
  attachExecutionHandlers();
  applyExecutionFilters();
}

async function refreshExecutionSummaries(force = false) {
  const button = document.getElementById('refreshExecutionsButton');
  const status = document.getElementById('execution-refresh-status');
  if (button) button.disabled = true;
  if (status) status.textContent = 'Refreshing...';
  try {
    const offline = await window.sprayOfflineReady;
    const records = await offline.refreshExecutions(force);
    renderExecutions(records);
    if (status) status.textContent = records.length ? 'Up to date' : 'No cached executions. Use Refresh to load.';
  } catch (error) {
    if (status) status.textContent = error.message || 'Unable to refresh';
  } finally {
    if (button) button.disabled = false;
  }
}

finalisedOptions.forEach(option => {
  option.addEventListener('change', () => {
    updateToggleSelection();
    applyExecutionFilters();
  });
});

if (weekFilter) {
  weekFilter.addEventListener('change', applyExecutionFilters);
}

if (blockFilter) {
  blockFilter.addEventListener('change', applyExecutionFilters);
}

updateToggleSelection();
document.getElementById('refreshExecutionsButton')?.addEventListener('click', () => refreshExecutionSummaries(true));
window.sprayOfflineReady.then(async offline => {
  renderExecutions(await offline.readExecutions());
  refreshExecutionSummaries(false);
}).catch(error => {
  const status = document.getElementById('execution-refresh-status');
  if (status) status.textContent = error.message || 'Unable to load cached executions';
});
</script>

{% endblock %}
