{% extends 'inventory_base.html' %}
{% block content %}
<style>
:root {
    --accent-color: #2d6cdf;
}

.page-wrap{ padding:1.5rem 2rem 3rem; max-width:1400px; margin:0 auto; }

.page-title-card{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1rem;
    margin-bottom:1.1rem;
    padding:0 0 1rem;
    border-bottom:1px solid #e5e7eb;
}

.page-title-card h2{
    margin:0 0 0.35rem;
    font-size:1.45rem;
    color:#111827;
    line-height:1.2;
}

.page-title-card .title-meta{
    color:#6b7280;
    font-size:0.98rem;
    line-height:1.5;
}

.title-number{
    display:inline-flex;
    align-items:center;
    margin-left:0.35rem;
    padding:0.2rem 0.7rem;
    background:rgba(45, 108, 223, 0.1);
    color:var(--accent-color);
    border:1px solid rgba(45, 108, 223, 0.14);
    border-radius:999px;
    font-size:0.95rem;
    font-weight:700;
}

.status-badge{
    display:inline-flex;
    align-items:center;
    padding:0.45rem 0.85rem;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    white-space:nowrap;
    background:#f3f4f6;
    color:#374151;
}

.status-badge.status-finalised,
.status-badge.status-complete,
.status-badge.status-completed{
    background:#ecfdf3;
    color:#15803d;
}

.status-badge.status-in-progress,
.status-badge.status-progress,
.status-badge.status-active{
    background:#eff6ff;
    color:#1d4ed8;
}

.status-badge.status-cancelled,
.status-badge.status-cancelled-recommendation{
    background:#fef2f2;
    color:#b91c1c;
}

.meta-strip{
    display:flex;
    flex-wrap:wrap;
    gap:0.75rem 1.25rem;
    margin-top:0.75rem;
    color:#374151;
    font-size:0.95rem;
}

.meta-pill{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
    min-width:140px;
}

.meta-pill strong{
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#6b7280;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:1.5rem;
    margin-top:1.5rem;
    margin-bottom:1.5rem;
    align-items:flex-end;
}

.section-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:1rem;
    overflow:hidden;
}

.section-header{
    padding:0.85rem 1rem;
    font-weight:600;
    border-bottom:1px solid #e5e7eb;
    border-left:4px solid var(--accent-color);
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#111827;
    background:#fafafa;
}

.section-body{ 
    padding:1rem;
    overflow-x:auto;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    font-size:0.75rem;
    text-transform:uppercase;
    color:#6b7280;
    padding:0.7rem 0.6rem;
    border-bottom:1px solid #e5e7eb;
    background:#fcfcfd;
}

td{
    padding:0.7rem 0.6rem;
    border-bottom:1px solid #f3f4f6;
    vertical-align:top;
}

tr:hover{
    background:#f9fafb;
}

.no-data{
    text-align:center;
    padding:2rem;
    color:#6b7280;
}

.info-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:0.75rem 1rem;
    margin:0;
}

.info-row{
    display:flex;
    flex-direction:column;
    gap:0.25rem;
    padding:0.75rem 0.85rem;
    background:#f9fafb;
    border:1px solid #eef2f7;
    border-radius:10px;
}

.info-row strong{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#6b7280;
}

.info-value{
    font-weight:600;
    color:#111827;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.5;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:0.75rem;
    margin-bottom:0.9rem;
    padding:0.85rem;
    background:#f9fafb;
    border:1px solid #eef2f7;
    border-radius:10px;
}

.summary-item{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
}

.summary-item strong{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#6b7280;
}

.summary-item span{
    font-weight:600;
    color:#111827;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:1rem;
}

.form-grid .form-group{
    margin-bottom:0;
}

.form-group{
    margin-bottom:1rem;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:0.4rem;
    font-size:0.9rem;
    color:#6b7280;
}

.edit-actions{
    display:flex;
    gap:0.5rem;
    margin-top:1rem;
    flex-wrap:wrap;
}

.scouting-text{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.6;
}

.mix-plan-list{
    display:flex;
    flex-direction:column;
    gap:0.75rem;
}

.mix-plan-item{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:0.85rem 1rem;
    background:#fcfcfd;
}

.mix-plan-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    margin-bottom:0.6rem;
    font-weight:700;
    color:#111827;
}

.mix-plan-meta{
    color:#6b7280;
    font-size:0.9rem;
}

.mix-plan-rows{
    display:flex;
    flex-direction:column;
    gap:0.45rem;
}

.mix-plan-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.7rem;
    padding:0.55rem 0.65rem;
    border-radius:8px;
    background:#fff;
    border:1px solid #f3f4f6;
}

.mix-plan-row strong{
    color:#111827;
    font-weight:700;
}

.edit-btn, .save-btn, .cancel-btn, .add-btn, .remove-btn{
    padding:0.5rem 1rem;
    border:none;
    border-radius:6px;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    transition:all 0.2s;
}

.edit-btn{
    background:#2d6cdf;
    color:white;
}

.edit-btn:hover{
    background:#1e4fa3;
}

.save-btn{
    background:#2563eb;
    color:white;
}

.save-btn:hover{
    background:#1d4ed8;
}

.cancel-btn{
    background:#6b7280;
    color:white;
}

.cancel-btn:hover{
    background:#4b5563;
}

.add-btn{
    background:#0f766e;
    color:white;
}

.add-btn:hover{
    background:#115e59;
}

input[type="text"], input[type="date"], input[type="number"], select, textarea{
    padding:0.55rem 0.65rem;
    border:1px solid #d1d5db;
    border-radius:6px;
    font-size:0.95rem;
    font-family:inherit;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:#2d6cdf;
    box-shadow:0 0 0 3px rgba(45, 108, 223, 0.12);
}

.product-select-container .select2-selection--single {
    min-width: 200px;
}

.product-dropdown {
    width: auto !important;
    min-width: 220px !important;
    max-width: 700px !important;
}

.product-select-container.select2-container--open .select2-dropdown {
    width: auto !important;
    min-width: 220px !important;
    max-width: 700px !important;
}

.section-header.edit-mode{
    background:#f3f7ff;
}

</style>

<div class="page-wrap">
  <div class="page-title-card" id="page-title"></div>

  <div id="spray-header"></div>
  <div id="spray-projects"></div>
  <div id="spray-lines"></div>
  <div id="spray-mixes"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
<script>

const sprayId = {{ spray_id }};
const canEdit = {{ 'true' if 'SPRAY_REC_EDIT' in current_user.permissions else 'false' }};
const canCreate = {{ 'true' if 'SPRAY_REC_CREATE' in current_user.permissions else 'false' }};
let sprayData = null;
let sprayType = null;
let doseBasis = null;

function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

let editModes = {
    header: false,
    methods: false,
    projects: false,
    lines: false
};

document.addEventListener("DOMContentLoaded", async () => {
    await renderHeader();
    await renderLines();
    const methodSelect = document.getElementById("method-select");
});


async function renderHeader() {
    const header = await fetchHeader(sprayId);
    console.log("Fetched header:", header);
    if (!header.success) {
        document.getElementById("spray-header").innerHTML = `<div class='no-data'>Error loading spray header: ${header.message || 'Unknown error'}</div>`;
        return;
    }

    const method = await fetchMethod(header.method_id);

    sprayData = sprayData || {};
    sprayData.header = header;
    doseBasis = header.dose_basis;

    applyPageThemeColor(header.crop_theme_color);

    const startDate = formatDateTime(header.start_datetime);
    const endDate = formatDateTime(header.end_datetime);
    const statusText = header.status || 'N/A';
    const statusClass = String(statusText || '').toLowerCase().replace(/\s+/g, '-');
    const statusBadgeClass = statusClass === 'finalised' || statusClass === 'complete' || statusClass === 'completed'
        ? 'status-finalised'
        : statusClass === 'in-progress' || statusClass === 'progress' || statusClass === 'active'
            ? 'status-in-progress'
            : statusClass === 'cancelled' || statusClass === 'cancelled-recommendation'
                ? 'status-cancelled'
                : 'status-default';

    const pageTitle = `
        <div>
            <h2>Spray Instruction <span class="title-number">#${escapeHtml(header.spray_no || 'N/A')}</span></h2>
            <div class="title-meta">${escapeHtml(header.spray_description || 'No description')}</div>
            <div class="meta-strip">
                <div class="meta-pill"><strong>Recommended</strong><span>${escapeHtml(header.spray_date || 'N/A')}</span></div>
                <div class="meta-pill"><strong>Warehouse</strong><span>${escapeHtml(header.warehouse ? header.warehouse.name : 'N/A')}</span></div>
                <div class="meta-pill"><strong>Week</strong><span>${escapeHtml(header.spray_week || 'N/A')}</span></div>
                <div class="meta-pill"><strong>Start</strong><span>${escapeHtml(startDate)}</span></div>
                <div class="meta-pill"><strong>End</strong><span>${escapeHtml(endDate)}</span></div>
            </div>
        </div>
        <div class="status-badge ${statusBadgeClass}">${escapeHtml(statusText)}</div>
    `;
    document.getElementById("page-title").innerHTML = pageTitle;

    let projectsSection = '';
    if (header.mix && header.projects && header.projects.length > 0) {
        const projectRows = header.projects.map(p => {
            let row = `<tr><td>${escapeHtml(p.project_code || '')}</td><td>${Number(p.ha || 0).toFixed(2)}</td>`;
            if (doseBasis === 'PER_100L') {
                row += `<td>${p.water_per_ha != null ? p.water_per_ha.toFixed(2) + ' L' : 'N/A'}</td><td>${p.total_water != null ? p.total_water.toFixed(2) + ' L' : 'N/A'}</td>`;
            }
            row += '</tr>';
            return row;
        }).join('');

        const waterHeaders = doseBasis === 'PER_100L' ? '<th>Water / Ha</th><th>Total Water</th>' : '';
        const methodDisplay = method ? `<div style="margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid #eee;"><strong>Method:</strong> ${escapeHtml(method.method_name || '')} | <strong>Water per Tank:</strong> ${header.water_per_tank != null ? header.water_per_tank.toFixed(2) + ' L' : 'N/A'}</div>` : '';
        const headerWaterInfo = `<div style="margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid #eee;"><strong>Water / Ha:</strong> ${header.water_per_ha != null ? header.water_per_ha.toFixed(2) + ' L' : 'N/A'} | <strong>Total Water:</strong> ${header.total_water != null ? header.total_water.toFixed(2) + ' L' : 'N/A'}</div>`;

        projectsSection = `
            <div class="section-card">
                <div class="section-header">
                    <span>Projects</span>
                    <span>${header.projects.length} project(s)</span>
                </div>
                <div class="section-body">
                    <div class="summary-grid">
                        <div class="summary-item"><strong>Spray Method</strong><span>${escapeHtml(method ? method.method_name : 'N/A')}</span></div>
                        <div class="summary-item"><strong>Water / Ha</strong><span>${header.water_per_ha != null ? header.water_per_ha.toFixed(2) + ' L' : 'N/A'}</span></div>
                        <div class="summary-item"><strong>Total Water</strong><span>${header.total_water != null ? header.total_water.toFixed(2) + ' L' : 'N/A'}</span></div>
                        <div class="summary-item"><strong>Water / Tank</strong><span>${header.water_per_tank != null ? header.water_per_tank.toFixed(2) + ' L' : 'N/A'}</span></div>
                    </div>
                    <div class="table-wrap">
                        <table style="margin-bottom:0;">
                            <thead>
                                <tr><th>Project</th><th>Hectares</th>${waterHeaders}</tr>
                            </thead>
                            <tbody>
                                ${projectRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    const headerEditBody = editModes.header ? `
            <div class="form-grid">
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="edit-description" value="${header.spray_description || ''}" class="form-control">
                </div>
                <div class="form-group">
                    <label>Recommended Date</label>
                    <input type="date" id="edit-date" value="${header.spray_date ? header.spray_date.split('T')[0] : ''}" onchange="updateWeekNo()">
                </div>
                <div class="form-group">
                    <label>Week No</label>
                    <input type="text" id="edit-week" value="${header.spray_week || ''}" readonly>
                </div>
                <div class="form-group">
                    <label>Scouting</label>
                    <textarea id="edit-scouting" maxlength="100" class="form-control">${header.scouting || ''}</textarea>
                </div>
            </div>
            <div class="edit-actions">
                <button class="save-btn" onclick="saveHeaderEdit()">Save</button>
                <button class="cancel-btn" onclick="cancelHeaderEdit()">Cancel</button>
            </div>
        ` : `
            <div class="info-list">
                <div class="info-row"><strong>Description</strong><div class="info-value">${escapeHtml(header.spray_description || 'No description')}</div></div>
                <div class="info-row"><strong>Weather</strong><div class="info-value">${escapeHtml(header.weather || 'N/A')}</div></div>
                <div class="info-row"><strong>Scouting</strong><div class="info-value scouting-text">${escapeHtml(header.scouting || 'No scouting notes')}</div></div>
            </div>
        `;

    const actionButtons = [];
    if (header.execution_id) {
        actionButtons.push(`<button class="edit-btn" onclick="openExecution(${header.execution_id})">Open Execution</button>`);
    }
    if (!editModes.header && !header.execution_id && canCreate) {
        actionButtons.push(`<button class="cancel-btn" onclick="cancelRecommendation()">Cancel Recommendation</button>`);
    }
    if (!editModes.header && header.finalised && header.execution_finalised) {
        actionButtons.push(`<button class="save-btn" onclick="printInstruction()">Print</button>`);
    }

    let html = `
        <div class="section-card">
            <div class="section-header" id="header-section-header">
                <span>Basic Details</span>
                ${canEdit ? `<button class="edit-btn" onclick="toggleEditMode('header')">${editModes.header ? 'Cancel' : 'Edit'}</button>` : ''}
            </div>
            <div class="section-body" id="header-section-content">
                ${headerEditBody}
            </div>
        </div>
        ${actionButtons.length ? `<div class="edit-actions" style="margin-top:0.25rem;">${actionButtons.join(' ')}</div>` : ''}
    `;

    document.getElementById("spray-header").innerHTML = html;
    document.getElementById("spray-projects").innerHTML = projectsSection;
}

function formatDateTime(value) {
    if (!value) return 'N/A';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'N/A';
    return date.toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'short'
    });
}

// Function to apply crop theme color to page background
function applyPageThemeColor(colorHex) {
    const body = document.querySelector('.with-fixed-taskbar');
    if (!colorHex) {
        document.documentElement.style.setProperty('--accent-color', '#2d6cdf');
        if (body) body.style.backgroundColor = '';
    } else {
        if (/^#[0-9A-F]{6}$/i.test(colorHex)) {
            document.documentElement.style.setProperty('--accent-color', colorHex);
            if (body) body.style.backgroundColor = '';
        }
    }
}

async function renderLines() {
    sprayData = sprayData || {};
    let lines;
    if (editModes.lines && sprayData.lines) {
        lines = sprayData.lines;
    } else {
        linesData = await fetchLines(sprayId);
        if (!linesData.success) {
            document.getElementById("spray-lines").innerHTML = `<div class='no-data'>Error loading spray lines: ${linesData.message || 'Unknown error'}</div>`;
            return;
        }
        sprayData.lines = linesData.lines;
        lines = sprayData.lines;
        console.log("Fetched lines:", linesData);
    }

    if (!lines || lines.length === 0) {
        document.getElementById("spray-lines").innerHTML =
            "<div class='no-data'>No spray lines found.</div>";
        return;
    }
    const qtyColumnText = doseBasis === 'PER_100L' ? "Qty / 100L" : "Qty / Ha";
    const editModeClass = editModes.lines ? 'edit-mode' : '';
    let productOptions = [];
    if (editModes.lines) {
        productOptions = await fetchProductsOptions(sprayId);
    }

    const productHeader = editModes.lines ? '<th colspan="2">Product</th>' : '<th>Stock Description</th><th>Active Ingredient</th>';
    let html = `
        <div class="section-card">
            <div class="section-header ${editModeClass}">
                <span>Spray Products</span>
                <div>
                    ${editModes.lines ? `<button class="save-btn" onclick="saveLinesEdit()">Save</button><button class="cancel-btn" onclick="cancelLinesEdit()">Cancel</button><button class="add-btn" onclick="addLine()">Add Line</button>` : (sprayData.header.issues_exist || !canEdit ? '' : `<button class="edit-btn" onclick="toggleEditMode('lines')">Edit</button>`) }
                </div>
            </div>
            <div class="section-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                ${productHeader}
                                <th>${qtyColumnText}</th>
                                <th>Total Qty</th>
                                ${editModes.lines ? '<th></th>' : ''}
                            </tr>
                        </thead>
                        <tbody id="lines-tbody">
    `;

    lines.forEach((line, idx) => {
        const qty = doseBasis === 'PER_100L' ? line.qty_per_100l : line.qty_per_ha;
        const qtyDisplay = qty !== null ? qty : 0;
        const totalQtyDisplay = line.total_qty !== null ? `<b>${line.total_qty.toFixed(2)} ${line.uom || ''}</b>` : '-';
        console.log(line.stock_description, typeof line.stock_id);

        if (editModes.lines) {
            const options = productOptions.map(product => {
                const ai = escapeHtml(product.active_ingredient || '');
                const desc = escapeHtml(product.stock_description || '');
                const qtyOnHand = product.qty_on_hand !== null ? parseFloat(product.qty_on_hand).toFixed(2) : '0.00';
                const unit = product.stocking_uom_code || '';
                return `<option value="${product.stock_link}" ${product.stock_link === parseInt(line.stock_id) ? 'selected' : ''} data-active-ingredient="${ai}">${ai} - ${desc} (Available: ${qtyOnHand} ${unit})</option>`;
            }).join('');
            html += `
                <tr data-line-idx="${idx}">
                    <td colspan="2">
                        <select class="line-product-select" data-line-idx="${idx}" onchange="handleLineProductChange(${idx})">
                            <option value="">Select product</option>
                            ${options}
                        </select>
                    </td>
                    <td><input type="number" class="line-qty-input" data-line-idx="${idx}" value="${qtyDisplay}" step="0.01" oninput="handleLineQtyChange(${idx})"></td>
                    <td><span class="total-qty-display">${totalQtyDisplay}</span></td>
                    <td><button class="remove-btn" onclick="removeLine(${idx})">Remove</button></td>
                </tr>
            `;
        } else {
            html += `
                <tr>
                    <td>${line.stock_description || '-'}</td>
                    <td>${line.active_ingredient || '-'}</td>
                    <td>${qty !== null ? `${qty.toFixed(2)} ${line.uom || ''}` : '-'}</td>
                    <td>${totalQtyDisplay}</td>
                </tr>
            `;
        }
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    document.getElementById("spray-lines").innerHTML = html;
    if (editModes.lines) {
        initLineSelects();
    }
    await renderMix();
}

function initLineSelects() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn || !window.jQuery.fn.select2) {
        return;
    }
    const $ = window.jQuery;
    $('.line-product-select').each(function() {
        const $select = $(this);
        if ($select.data('select2')) {
            $select.select2('destroy');
        }
        $select.select2({
            width: '100%',
            placeholder: 'Search product',
            allowClear: true,
            dropdownAutoWidth: true,
            dropdownCssClass: 'product-dropdown',
            containerCssClass: 'product-select-container'
        }).on('select2:opening', function() {
            const s2 = $(this).data('select2');
            if (s2 && s2.$dropdown && s2.$container) {
                const closedWidth = s2.$container.outerWidth();
                if (closedWidth) {
                    s2.$dropdown.css('min-width', closedWidth + 'px');
                }
            }
        });
    });

    $(document).off('select2:open.sprayInstruction').on('select2:open.sprayInstruction', () => {
        setTimeout(() => {
            const search = document.querySelector('.select2-container--open .select2-search__field');
            if (search) {
                search.focus();
            }
        }, 0);
    });
}

function handleLineProductChange(idx) {
    const select = document.querySelector(`select[data-line-idx="${idx}"]`);
    const line = sprayData.lines[idx];
    if (!select || !line) return;

    const selected = select.options[select.selectedIndex];
    line.stock_id = select.value || null;
    line.stock_description = selected ? selected.textContent : '';
    line.active_ingredient = selected ? selected.dataset.activeIngredient : '';
    recalculateMixes();
}

function syncLineInputs() {
    const rows = document.querySelectorAll('tr[data-line-idx]');
    rows.forEach(row => {
        const idx = parseInt(row.dataset.lineIdx, 10);
        const line = sprayData.lines[idx];
        if (!line) return;

        const select = row.querySelector('select[data-line-idx]');
        if (select) {
            line.stock_id = select.value || null;
            const selected = select.options[select.selectedIndex];
            line.stock_description = selected ? selected.textContent : line.stock_description;
            line.active_ingredient = selected ? selected.dataset.activeIngredient : line.active_ingredient;
        }
        console.log(select ? select.value : null, line.stock_description, line.stock_id);
        const input = row.querySelector('input.line-qty-input');
        if (input) {
            const value = parseFloat(input.value);
            if (doseBasis === 'PER_100L') {
                line.qty_per_100l = isNaN(value) ? 0 : value;
            } else {
                line.qty_per_ha = isNaN(value) ? 0 : value;
            }
            const totalHa = sprayData.header.total_ha || 0;
            const totalWater = sprayData.header.total_water || 0;
            if (doseBasis === 'PER_100L' && totalWater > 0) {
                line.total_qty = ((line.qty_per_100l || 0) / 100) * totalWater;
            } else if (doseBasis === 'PER_HA' && totalHa > 0) {
                line.total_qty = ((line.qty_per_ha || 0) * totalHa);
            }
        }
    });
}

function addLine() {
    syncLineInputs();
    const newLine = {
        line_id: null,
        stock_id: null,
        stock_description: '',
        active_ingredient: '',
        dose_basis: doseBasis,
        qty_per_100l: doseBasis === 'PER_100L' ? 0 : null,
        qty_per_ha: doseBasis === 'PER_HA' ? 0 : null,
        total_qty: 0,
        uom_id: null,
        uom: ''
    };
    sprayData.lines.push(newLine);

    // ensure an empty placeholder appears in the mix section too
    sprayData.mixLines = sprayData.mixLines || [];
    const firstMix = sprayData.mixLines[0] || {};
    const targetMixNumber = firstMix.mix_number != null ? Number(firstMix.mix_number) : 1;
    const placeholderIndex = sprayData.lines.length - 1;
    sprayData.mixLines.push({
        line_id: null,
        stock_id: newLine.stock_id,
        stock_description: newLine.stock_description,
        active_ingredient: newLine.active_ingredient,
        qty: newLine.total_qty,
        uom: newLine.uom,
        mix_number: targetMixNumber,
        water: firstMix.water != null ? firstMix.water : 0,
        mix_ha: firstMix.mix_ha != null ? firstMix.mix_ha : 0,
        placeholder_for_line_idx: placeholderIndex
    });

    renderLines();
    recalculateMixes();
}

function removeLine(idx) {
    syncLineInputs();
    sprayData.lines.splice(idx, 1);
    renderLines();
    recalculateMixes();
}

async function saveLinesEdit() {
    syncLineInputs();
    const payload = {
        lines: sprayData.lines.map(line => ({
            line_id: line.line_id,
            stock_id: line.stock_id,
            qty_per_100l: line.qty_per_100l,
            qty_per_ha: line.qty_per_ha,
            total_qty: line.total_qty,
            uom_id: line.uom_id
        }))
    };

    const response = await request(`/agri/spray/${sprayId}/edit_spray_lines`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const result = await response.json();

    if (!response.ok || !result.success) {
        Swal.fire({
            icon: 'error',
            title: 'Save failed',
            text: result.message || 'Failed to save spray lines.'
        });
        return;
    }

    await Swal.fire({
        icon: 'success',
        title: 'Saved',
        text: 'Spray lines saved successfully!',
        timer: 1500,
        showConfirmButton: false
    });

    editModes.lines = false;
    sprayData.lines = await fetchLines(sprayId);
    renderLines();
    await renderMix(true);
}

async function cancelLinesEdit() {
    editModes.lines = false;
    sprayData.lines = await fetchLines(sprayId);
    renderLines();
}

async function renderMix(forceFetch = false) {
    sprayData = sprayData || {};
    let lines = sprayData.mixLines;
    if (forceFetch || !lines) {
        lines = await fetchMixLines(sprayId);
        if (!lines) return;
        sprayData.mixLines = lines;
    }

    const mixContainer = document.getElementById("spray-mixes");
    if (!mixContainer) return;

    if (!lines || lines.length === 0) {
        mixContainer.innerHTML = `
            <div class="section-card">
                <div class="section-header"><span>Mix Plan</span></div>
                <div class="section-body"><div class='no-data'>No spray lines found.</div></div>
            </div>
        `;
        return;
    }

    const mixGroups = {};
    lines.forEach(line => {
        if (!mixGroups[line.mix_number]) {
            mixGroups[line.mix_number] = [];
        }
        mixGroups[line.mix_number].push(line);
    });

    let html = `
        <div class="section-card">
            <div class="section-header">
                <span>Mix Plan</span>
                <span>${Object.keys(mixGroups).length} mix${Object.keys(mixGroups).length === 1 ? '' : 'es'}</span>
            </div>
            <div class="section-body">
                <div class="mix-plan-list">
    `;

    Object.keys(mixGroups).sort((a,b)=>a-b).forEach(mixNo => {
        const mixLines = mixGroups[mixNo];
        const firstLine = mixLines[0] || {};

        const waterDisplay = typeof firstLine.water === 'number' && !isNaN(firstLine.water) ? `${firstLine.water.toFixed(2)} L Water` : '-';
        const mixHaDisplay = typeof firstLine.mix_ha === 'number' && !isNaN(firstLine.mix_ha) ? `${firstLine.mix_ha.toFixed(2)} Ha` : '-';
        const productItems = mixLines.map(line => {
            const qtyDisplay = typeof line.qty === 'number' && !isNaN(line.qty) ? line.qty.toFixed(2) : '-';
            return `
                <div class="mix-plan-row">
                    <span>${escapeHtml(line.stock_description || '-')}</span>
                    <strong>${qtyDisplay} ${line.uom || ''}</strong>
                </div>
            `;
        }).join('');

        html += `
            <div class="mix-plan-item">
                <div class="mix-plan-header">
                    <span>Mix ${mixNo}</span>
                    <span class="mix-plan-meta">${waterDisplay} • ${mixHaDisplay}</span>
                </div>
                <div class="mix-plan-rows">${productItems}</div>
            </div>
        `;
    });
    
    html += `
                </div>
            </div>
        </div>
    `;
    mixContainer.innerHTML = html;
}

function updateWeekNo() {
    const dateInput = document.getElementById('edit-date');
    if (!dateInput.value) return;
    const date = new Date(dateInput.value);
    const weekNo = getWeekNumber(date);
    const year = date.getFullYear();
    document.getElementById('edit-week').value = `${year}-${String(weekNo).padStart(2, '0')}`;
}

function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function handleLineQtyChange(idx) {
    const input = document.querySelector(`input[data-line-idx="${idx}"]`);
    const newQty = parseFloat(input.value) || 0;
    const line = sprayData.lines[idx];
    
    // Update line data
    if (doseBasis === 'PER_100L') {
        line.qty_per_100l = newQty;
    } else {
        line.qty_per_ha = newQty;
    }
    
    // Recalculate total qty
    const totalHa = sprayData.header.total_ha || 0;
    const totalWater = sprayData.header.total_water || 0;
    
    if (doseBasis === 'PER_100L' && totalWater > 0) {
        line.total_qty = (newQty / 100) * totalWater;
    } else if (doseBasis === 'PER_HA' && totalHa > 0) {
        line.total_qty = newQty * totalHa;
    }
    
    // Update display
    const row = document.querySelector(`tr[data-line-idx="${idx}"]`);
    const totalQtySpan = row.querySelector('.total-qty-display');
    totalQtySpan.innerHTML = `<b>${line.total_qty.toFixed(2)} ${line.uom || ''}</b>`;
    
    // Recalculate mixes
    recalculateMixes();
}

function recalculateMixes() {
    sprayData = sprayData || {};
    const sprayLines = sprayData.lines || [];
    const existingMixLines = Array.isArray(sprayData.mixLines) ? [...sprayData.mixLines] : [];

    if (!sprayLines.length) {
        renderMix();
        return;
    }

    const mixGroups = new Map();
    existingMixLines.forEach(line => {
        const mixNumber = line.mix_number != null ? Number(line.mix_number) : 1;
        if (!mixGroups.has(mixNumber)) {
            mixGroups.set(mixNumber, []);
        }
        mixGroups.get(mixNumber).push(line);
    });

    if (mixGroups.size === 0) {
        mixGroups.set(1, []);
    }

    const updatedMixLines = [];
    mixGroups.forEach((groupLines, mixNumber) => {
        const water = groupLines.find(line => line.water != null)?.water ?? 0;
        const mixHa = groupLines.find(line => line.mix_ha != null)?.mix_ha ?? 0;

        const placeholderIndexMap = new Map();
        const idMap = new Map();
        const codeMap = new Map();
        const usedKeys = new Set();

        groupLines.forEach(line => {
            if (typeof line.placeholder_for_line_idx === 'number') {
                placeholderIndexMap.set(Number(line.placeholder_for_line_idx), line);
            }
            if (line.stock_id != null) {
                idMap.set(`id:${line.stock_id}`, line);
            }
            if (line.stock_description) {
                codeMap.set(`code:${line.stock_description}`, line);
            }
        });

        sprayLines.forEach((line, idx) => {
            const basis = line.dose_basis || doseBasis;
            const qtyPerHa = typeof line.qty_per_ha === 'number' && !isNaN(line.qty_per_ha) ? line.qty_per_ha : 0;
            const qtyPer100L = typeof line.qty_per_100l === 'number' && !isNaN(line.qty_per_100l) ? line.qty_per_100l : 0;
            let qty = 0;

            if (basis === 'PER_HA') {
                qty = (typeof mixHa === 'number' && !isNaN(mixHa)) ? qtyPerHa * mixHa : 0;
            } else if (basis === 'PER_100L') {
                qty = (typeof water === 'number' && !isNaN(water)) ? (qtyPer100L / 100) * water : 0;
            } else {
                qty = typeof line.total_qty === 'number' && !isNaN(line.total_qty) ? line.total_qty : 0;
            }

            const existing = placeholderIndexMap.get(idx)
                || (line.stock_id ? idMap.get(`id:${line.stock_id}`) : null)
                || (line.stock_description ? codeMap.get(`code:${line.stock_description}`) : null);
            const mixLine = existing ? {
                ...existing,
                stock_id: line.stock_id,
                stock_description: line.stock_description,
                active_ingredient: line.active_ingredient,
                qty,
                uom: line.uom || existing.uom || '',
                placeholder_for_line_idx: idx,
                mix_number: mixNumber,
                water,
                mix_ha: mixHa
            } : {
                stock_id: line.stock_id,
                stock_description: line.stock_description,
                active_ingredient: line.active_ingredient,
                qty,
                uom: line.uom || '',
                mix_number: mixNumber,
                water,
                mix_ha: mixHa,
                placeholder_for_line_idx: idx
            };

            if (mixLine.stock_id != null) {
                usedKeys.add(`id:${mixLine.stock_id}`);
            }
            if (mixLine.stock_description) {
                usedKeys.add(`code:${mixLine.stock_description}`);
            }
            updatedMixLines.push(mixLine);
        });

        // Preserve any unmapped legacy mix lines that don't correspond to current spray lines.
        groupLines.forEach(line => {
            const keyId = line.stock_id != null ? `id:${line.stock_id}` : null;
            const keyCode = line.stock_description ? `code:${line.stock_description}` : null;
            const isPlaceholder = typeof line.placeholder_for_line_idx === 'number';
            if (isPlaceholder) return;
            if ((keyId && usedKeys.has(keyId)) || (keyCode && usedKeys.has(keyCode))) return;
            updatedMixLines.push({
                ...line,
                mix_number: mixNumber,
                water,
                mix_ha: mixHa
            });
        });
    });

    sprayData.mixLines = updatedMixLines;
    renderMix();
}

function openExecution(executionId) {
    // Navigate to the execution view for this execution
    if (!executionId) return;
    window.location.href = `/agri/execution/${executionId}`;
