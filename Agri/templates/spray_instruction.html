{% extends 'inventory_base.html' %}
{% block content %}
<style>
:root {
    --accent-color: #2d6cdf;
}

.page-wrap{ padding:1.5rem 2rem 3rem; max-width:1400px; margin:0 auto; }

.page-title-card{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1rem;
    margin-bottom:1.1rem;
    padding:0 0 1rem;
    border-bottom:1px solid #e5e7eb;
}

.page-title-card h2{
    margin:0 0 0.35rem;
    font-size:1.45rem;
    color:#111827;
    line-height:1.2;
}

.page-title-card .title-meta{
    color:#6b7280;
    font-size:0.98rem;
    line-height:1.5;
}

.title-number{
    display:inline-flex;
    align-items:center;
    margin-left:0.35rem;
    padding:0.2rem 0.7rem;
    background:rgba(45, 108, 223, 0.1);
    color:var(--accent-color);
    border:1px solid rgba(45, 108, 223, 0.14);
    border-radius:999px;
    font-size:0.95rem;
    font-weight:700;
}

.status-badge{
    display:inline-flex;
    align-items:center;
    padding:0.45rem 0.85rem;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    white-space:nowrap;
    background:#f3f4f6;
    color:#374151;
}

.status-badge.status-finalised,
.status-badge.status-complete,
.status-badge.status-completed{
    background:#ecfdf3;
    color:#15803d;
}

.status-badge.status-in-progress,
.status-badge.status-progress,
.status-badge.status-active{
    background:#eff6ff;
    color:#1d4ed8;
}

.status-badge.status-cancelled,
.status-badge.status-cancelled-recommendation{
    background:#fef2f2;
    color:#b91c1c;
}

.meta-strip{
    display:flex;
    flex-wrap:wrap;
    gap:0.75rem 1.25rem;
    margin-top:0.75rem;
    color:#374151;
    font-size:0.95rem;
}

.meta-pill{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
    min-width:140px;
}

.meta-pill strong{
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#6b7280;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:1.5rem;
    margin-top:1.5rem;
    margin-bottom:1.5rem;
    align-items:flex-end;
}

.section-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:1rem;
    overflow:hidden;
}

.section-header{
    padding:0.85rem 1rem;
    font-weight:600;
    border-bottom:1px solid #e5e7eb;
    border-left:4px solid var(--accent-color);
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#111827;
    background:#fafafa;
}

.section-body{ 
    padding:1rem;
    overflow-x:auto;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    font-size:0.75rem;
    text-transform:uppercase;
    color:#6b7280;
    padding:0.7rem 0.6rem;
    border-bottom:1px solid #e5e7eb;
    background:#fcfcfd;
}

td{
    padding:0.7rem 0.6rem;
    border-bottom:1px solid #f3f4f6;
    vertical-align:top;
}

tr:hover{
    background:#f9fafb;
}

.no-data{
    text-align:center;
    padding:2rem;
    color:#6b7280;
}

.info-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:0.75rem 1rem;
    margin:0;
}

.info-row{
    display:flex;
    flex-direction:column;
    gap:0.25rem;
    padding:0.75rem 0.85rem;
    background:#f9fafb;
    border:1px solid #eef2f7;
    border-radius:10px;
}

.info-row strong{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#6b7280;
}

.info-value{
    font-weight:600;
    color:#111827;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.5;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:0.75rem;
    margin-bottom:0.9rem;
    padding:0.85rem;
    background:#f9fafb;
    border:1px solid #eef2f7;
    border-radius:10px;
}

.summary-item{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
}

.summary-item strong{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#6b7280;
}

.summary-item span{
    font-weight:600;
    color:#111827;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:1rem;
}

.form-grid .form-group{
    margin-bottom:0;
}

.form-group{
    margin-bottom:1rem;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:0.4rem;
    font-size:0.9rem;
    color:#6b7280;
}

.edit-actions{
    display:flex;
    gap:0.5rem;
    margin-top:1rem;
    flex-wrap:wrap;
}

.scouting-text{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.6;
}

.mix-plan-list{
    display:flex;
    flex-direction:column;
    gap:0.75rem;
}

.mix-plan-item{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:0.85rem 1rem;
    background:#fcfcfd;
}

.mix-plan-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    margin-bottom:0.6rem;
    font-weight:700;
    color:#111827;
}

.mix-plan-meta{
    color:#6b7280;
    font-size:0.9rem;
}

.mix-plan-rows{
    display:flex;
    flex-direction:column;
    gap:0.45rem;
}

.mix-plan-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.7rem;
    padding:0.55rem 0.65rem;
    border-radius:8px;
    background:#fff;
    border:1px solid #f3f4f6;
}

.mix-plan-row strong{
    color:#111827;
    font-weight:700;
}

.edit-btn, .save-btn, .cancel-btn, .add-btn, .remove-btn{
    padding:0.5rem 1rem;
    border:none;
    border-radius:6px;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    transition:all 0.2s;
}

.edit-btn{
    background:#2d6cdf;
    color:white;
}

.edit-btn:hover{
    background:#1e4fa3;
}

.save-btn{
    background:#2563eb;
    color:white;
}

.save-btn:hover{
    background:#1d4ed8;
}

.cancel-btn{
    background:#6b7280;
    color:white;
}

.cancel-btn:hover{
    background:#4b5563;
}

.add-btn{
    background:#0f766e;
    color:white;
}

.add-btn:hover{
    background:#115e59;
}

input[type="text"], input[type="date"], input[type="number"], select, textarea{
    padding:0.55rem 0.65rem;
    border:1px solid #d1d5db;
    border-radius:6px;
    font-size:0.95rem;
    font-family:inherit;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:#2d6cdf;
    box-shadow:0 0 0 3px rgba(45, 108, 223, 0.12);
}

.product-select-container .select2-selection--single {
    min-width: 200px;
}

.product-dropdown {
    width: auto !important;
    min-width: 220px !important;
    max-width: 700px !important;
}

.product-select-container.select2-container--open .select2-dropdown {
    width: auto !important;
    min-width: 220px !important;
    max-width: 700px !important;
}

.section-header.edit-mode{
    background:#f3f7ff;
}

</style>

<div class="page-wrap">
  <div class="page-title-card" id="page-title"></div>

  <div id="spray-header"></div>
  <div id="spray-projects"></div>
  <div id="spray-lines"></div>
  <div id="spray-mixes"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
<script>

const sprayId = {{ spray_id }};
const canEdit = {{ 'true' if 'SPRAY_REC_EDIT' in current_user.permissions else 'false' }};
const canCreate = {{ 'true' if 'SPRAY_REC_CREATE' in current_user.permissions else 'false' }};
let sprayData = null;
let sprayType = null;
let doseBasis = null;

function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

let editModes = {
    header: false,
    methods: false,
    projects: false,
    lines: false
};

document.addEventListener("DOMContentLoaded", async () => {
    await renderHeader();
    await renderLines();
    const methodSelect = document.getElementById("method-select");
});


async function renderHeader() {
    const header = await fetchHeader(sprayId);
    console.log("Fetched header:", header);
    if (!header.success) {
        document.getElementById("spray-header").innerHTML = `<div class='no-data'>Error loading spray header: ${header.message || 'Unknown error'}</div>`;
        return;
    }

    const method = header.method_name;
    const methods = await fetchMethods(sprayId);

    sprayData = sprayData || {};
    sprayData.header = header;
    sprayData.methods = methods;
    doseBasis = header.dose_basis;

    console.log(sprayData, method);

    applyPageThemeColor(header.crop_theme_color);

    const startDate = formatDateTime(header.start_datetime);
    const endDate = formatDateTime(header.end_datetime);
    const statusText = header.status || 'N/A';
    const statusClass = String(statusText || '').toLowerCase().replace(/\s+/g, '-');
    const statusBadgeClass = statusClass === 'finalised' || statusClass === 'complete' || statusClass === 'completed'
        ? 'status-finalised'
        : statusClass === 'in-progress' || statusClass === 'progress' || statusClass === 'active'
            ? 'status-in-progress'
            : statusClass === 'cancelled' || statusClass === 'cancelled-recommendation'
                ? 'status-cancelled'
                : 'status-default';

    const pageTitle = `
        <div>
            <h2>Spray Instruction <span class="title-number">#${escapeHtml(header.spray_no || 'N/A')}</span></h2>
            <div class="title-meta">${escapeHtml(header.spray_description || 'No description')}</div>
            <div class="meta-strip">
                <div class="meta-pill"><strong>Recommended</strong><span>${escapeHtml(header.spray_date || 'N/A')}</span></div>
                <div class="meta-pill"><strong>Warehouse</strong><span>${escapeHtml(header.warehouse ? header.warehouse.name : 'N/A')}</span></div>
                <div class="meta-pill"><strong>Week</strong><span>${escapeHtml(header.spray_week || 'N/A')}</span></div>
                <div class="meta-pill"><strong>Weather</strong><span>${escapeHtml(header.weather || 'N/A')}</span></div>
                <div class="meta-pill"><strong>Start</strong><span>${escapeHtml(startDate)}</span></div>
                <div class="meta-pill"><strong>End</strong><span>${escapeHtml(endDate)}</span></div>
            </div>
        </div>
        <div class="status-badge ${statusBadgeClass}">${escapeHtml(statusText)}</div>
    `;
    document.getElementById("page-title").innerHTML = pageTitle;

    const doseModeValue = header.dose_basis || 'PER_100L';
    const methodOptions = methods.map(m => `
        <option value="${m.id}" ${String(m.id) === String(header.method_id || '') ? 'selected' : ''}>${escapeHtml(m.method_name || 'Unnamed method')}</option>
    `).join('');

    const projectWaterFields = (header.projects || []).map((project, index) => `
        <div class="form-group">
            <label>${escapeHtml(project.project_code || `Project ${index + 1}`)}</label>
            <div class="form-grid" style="grid-template-columns:repeat(2,minmax(160px,1fr));">
                <div class="form-group" style="margin-bottom:0;">
                    <label style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;">Water / Ha</label>
                    <input type="number" step="0.01" inputmode="decimal" data-project-water-index="${index}" id="project-water-ha-${index}" value="${project.water_per_ha != null ? String(project.water_per_ha) : ''}" oninput="syncProjectEditorState()">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;">Total Water</label>
                    <input type="number" step="0.01" inputmode="decimal" data-project-total-water-index="${index}" id="project-total-water-${index}" value="${project.total_water != null ? String(project.total_water) : ''}" oninput="syncProjectEditorState()">
                </div>
            </div>
        </div>
    `).join('');

    let projectsSection = '';
    if (header.projects && header.projects.length > 0) {
        const projectRows = header.projects.map(p => {
            let row = `<tr><td>${escapeHtml(p.project_code || '')}</td><td>${Number(p.ha || 0).toFixed(2)}</td>`;
            if (doseModeValue === 'PER_100L') {
                row += `<td>${p.water_per_ha != null ? p.water_per_ha.toFixed(2) + ' L' : 'N/A'}</td><td>${p.total_water != null ? p.total_water.toFixed(2) + ' L' : 'N/A'}</td>`;
            }
            row += '</tr>';
            return row;
        }).join('');

        const waterHeaders = doseModeValue === 'PER_100L' ? '<th>Water / Ha</th><th>Total Water</th>' : '';

        const projectEditor = editModes.projects ? `
            <div class="form-grid" style="padding-top:0.5rem;">
                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Dose Basis</label>
                    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0.75rem;">
                        <label style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 0.8rem;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;">
                            <input type="radio" name="edit-project-dose-basis" value="PER_100L" ${doseModeValue === 'PER_100L' ? 'checked' : ''} onchange="syncProjectEditorState()">
                            <span>Per 100L</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 0.8rem;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;">
                            <input type="radio" name="edit-project-dose-basis" value="PER_HA" ${doseModeValue === 'PER_HA' ? 'checked' : ''} onchange="syncProjectEditorState()">
                            <span>Per Ha (Mix)</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 0.8rem;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;">
                            <input type="radio" name="edit-project-dose-basis" value="PER_HA_DIRECT" ${doseModeValue === 'PER_HA_DIRECT' ? 'checked' : ''} onchange="syncProjectEditorState()">
                            <span>Per Ha (Direct)</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="project-water-editor" style="grid-column:1 / -1; ${doseModeValue === 'PER_100L' ? '' : 'display:none;'}">
                    <label>Water by Project</label>
                    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0.75rem;">
                        ${projectWaterFields || '<div class="no-data" style="padding:1rem 0;">No projects linked to this spray instruction.</div>'}
                    </div>
                </div>
                <div class="form-group" id="project-global-water-editor" style="grid-column:1 / -1; ${doseModeValue === 'PER_HA' ? '' : 'display:none;'}">
                    <label>Global Water Settings</label>
                    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Water / Tank</label>
                            <input type="number" step="0.01" inputmode="decimal" id="project-global-water-per-tank" value="${header.water_per_tank != null ? String(header.water_per_tank) : ''}" oninput="syncProjectEditorState()">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Water / Ha</label>
                            <input type="number" step="0.01" inputmode="decimal" id="project-global-water-per-ha" value="${header.water_per_ha != null ? String(header.water_per_ha) : ''}" oninput="syncProjectEditorState()">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Total Water</label>
                            <input type="number" step="0.01" inputmode="decimal" id="project-global-total-water" value="${header.total_water != null ? String(header.total_water) : ''}" oninput="syncProjectEditorState()">
                        </div>
                    </div>
                </div>
                <div class="form-group" id="project-global-water-editor-100l" style="grid-column:1 / -1; ${doseModeValue === 'PER_100L' ? '' : 'display:none;'}">
                    <label>Global Water Settings</label>
                    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Water / Tank</label>
                            <input type="number" step="0.01" inputmode="decimal" id="project-global-water-per-tank-100l" value="${header.water_per_tank != null ? String(header.water_per_tank) : ''}" oninput="syncProjectEditorState()">
                        </div>
                    </div>
                </div>
                <div class="edit-actions" style="margin-top:0.5rem;">
                    <button class="save-btn" onclick="saveProjectsEdit()">Save Projects</button>
                    <button class="cancel-btn" onclick="cancelProjectsEdit()">Cancel</button>
                </div>
            </div>
        ` : `
            <div class="summary-grid">
                <div class="summary-item"><strong>Dose Basis</strong><span>${escapeHtml(doseModeValue || 'N/A')}</span></div>
                <div class="summary-item"><strong>Water / Tank</strong><span>${header.water_per_tank != null ? header.water_per_tank.toFixed(2) + ' L' : (doseModeValue === 'PER_100L' ? 'N/A' : '—')}</span></div>
                <div class="summary-item"><strong>Water / Ha</strong><span>${header.water_per_ha != null ? header.water_per_ha.toFixed(2) + ' L' : (doseModeValue === 'PER_HA' ? 'N/A' : '—')}</span></div>
                <div class="summary-item"><strong>Total Water</strong><span>${header.total_water != null ? header.total_water.toFixed(2) + ' L' : (doseModeValue === 'PER_100L' || doseModeValue === 'PER_HA' ? 'N/A' : '—')}</span></div>
            </div>
        `;

        const canEditProjects = canEdit && !header.issues_exist && !header.finalised;

        projectsSection = `
            <div class="section-card">
                <div class="section-header">
                    <span>Projects</span>
                    ${canEditProjects ? `<button class="edit-btn" onclick="toggleEditMode('projects')">${editModes.projects ? 'Cancel' : 'Edit Projects'}</button>` : ''}
                </div>
                <div class="section-body">
                    ${projectEditor}
                    <div class="table-wrap" style="margin-top:1rem;">
                        <table style="margin-bottom:0;">
                            <thead>
                                <tr><th>Project</th><th>Hectares</th>${waterHeaders}</tr>
                            </thead>
                            <tbody>
                                ${projectRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    const headerEditBody = editModes.header ? `
            <div class="form-grid">
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="edit-description" value="${header.spray_description || ''}" class="form-control">
                </div>
                <div class="form-group">
                    <label>Recommended Date</label>
                    <input type="date" id="edit-date" value="${header.spray_date ? header.spray_date.split('T')[0] : ''}" onchange="updateWeekNo()">
                </div>
                <div class="form-group">
                    <label>Week No</label>
                    <input type="text" id="edit-week" value="${header.spray_week || ''}" readonly>
                </div>
                <div class="form-group">
                    <label>Method</label>
                    <select id="edit-method-id" class="form-control">
                        <option value="">Select a method</option>
                        ${methodOptions}
                    </select>
                </div>
                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Scouting</label>
                    <textarea id="edit-scouting" maxlength="100" class="form-control">${header.scouting || ''}</textarea>
                </div>
            </div>
            <div class="edit-actions">
                <button class="save-btn" onclick="saveHeaderEdit()">Save Details</button>
                <button class="cancel-btn" onclick="cancelHeaderEdit()">Cancel</button>
            </div>
        ` : `
            <div class="info-list">
                <div class="info-row"><strong>Description</strong><div class="info-value">${escapeHtml(header.spray_description || 'No description')}</div></div>
                <div class="info-row"><strong>Method</strong><div class="info-value">${escapeHtml(method ? method : 'N/A')}</div></div>
                <div class="info-row"><strong>Scouting</strong><div class="info-value scouting-text">${escapeHtml(header.scouting || 'No scouting notes')}</div></div>
            </div>
        `;

    const actionButtons = [];
    if (header.execution_id) {
        actionButtons.push(`<button class="edit-btn" onclick="openExecution(${header.execution_id})">Open Execution</button>`);
    }
    if (!editModes.header && !header.execution_id && canCreate) {
        actionButtons.push(`<button class="cancel-btn" onclick="cancelRecommendation()">Cancel Recommendation</button>`);
    }
    if (!editModes.header && header.finalised && header.execution_finalised) {
        actionButtons.push(`<button class="save-btn" onclick="printInstruction()">Print</button>`);
    }

    let html = `
        <div class="section-card">
            <div class="section-header" id="header-section-header">
                <span>Basic Details</span>
                ${canEdit ? `<button class="edit-btn" onclick="toggleEditMode('header')">${editModes.header ? 'Cancel' : 'Edit Details'}</button>` : ''}
            </div>
            <div class="section-body" id="header-section-content">
                ${headerEditBody}
            </div>
        </div>
        ${actionButtons.length ? `<div class="edit-actions" style="margin-top:0.25rem;">${actionButtons.join(' ')}</div>` : ''}
    `;

    document.getElementById("spray-header").innerHTML = html;
    document.getElementById("spray-projects").innerHTML = projectsSection;
    if (editModes.projects) {
        syncProjectEditorState();
    }
}

function formatDateTime(value) {
    if (!value) return 'N/A';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'N/A';
    return date.toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'short'
    });
}

// Function to apply crop theme color to page background
function applyPageThemeColor(colorHex) {
    const body = document.querySelector('.with-fixed-taskbar');
    if (!colorHex) {
        document.documentElement.style.setProperty('--accent-color', '#2d6cdf');
        if (body) body.style.backgroundColor = '';
    } else {
        if (/^#[0-9A-F]{6}$/i.test(colorHex)) {
            document.documentElement.style.setProperty('--accent-color', colorHex);
            if (body) body.style.backgroundColor = '';
        }
    }
}

function initLineSelects() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn || !window.jQuery.fn.select2) {
        return;
    }
    const $ = window.jQuery;
    $('.line-product-select').each(function() {
        const $select = $(this);
        if ($select.data('select2')) {
            $select.select2('destroy');
        }
        $select.select2({
            width: '100%',
            placeholder: 'Search product',
            allowClear: true,
            dropdownAutoWidth: true,
            dropdownCssClass: 'product-dropdown',
            containerCssClass: 'product-select-container'
        }).on('select2:opening', function() {
            const s2 = $(this).data('select2');
            if (s2 && s2.$dropdown && s2.$container) {
                const closedWidth = s2.$container.outerWidth();
                if (closedWidth) {
                    s2.$dropdown.css('min-width', closedWidth + 'px');
                }
            }
        });
    });

    $(document).off('select2:open.sprayInstruction').on('select2:open.sprayInstruction', () => {
        setTimeout(() => {
            const search = document.querySelector('.select2-container--open .select2-search__field');
            if (search) {
                search.focus();
            }
        }, 0);
    });
}

function handleLineProductChange(idx) {
    const select = document.querySelector(`select[data-line-idx="${idx}"]`);
    const line = sprayData.lines[idx];
    if (!select || !line) return;

    const selected = select.options[select.selectedIndex];
    line.stock_id = select.value || null;
    line.stock_description = selected?.dataset.stockDescription || '';
    line.active_ingredient = selected ? selected.dataset.activeIngredient : '';
    line.uom_id = selected?.dataset.uomId ? Number(selected.dataset.uomId) : null;
    line.uom = selected?.dataset.uomCode || '';
    updateLineTotal(idx);
    recalculateMixes();
}

function calculateLineTotal(line) {
    const quantity = doseBasis === 'PER_100L' ? Number(line.qty_per_100l || 0) : Number(line.qty_per_ha || 0);
    const totalWater = Number(sprayData?.header?.total_water || 0);
    const totalHa = Number(sprayData?.header?.total_ha || 0);
    console.log(sprayData);
    if (doseBasis === 'PER_100L') {
        return totalWater > 0 ? (quantity / 100) * totalWater : 0;
    }
    if (doseBasis === 'PER_HA') {
        return totalHa > 0 ? quantity * totalHa : 0;
    }
    return Number(line.total_qty || 0);
}

function updateLineTotal(idx) {
    const line = sprayData?.lines?.[idx];
    const row = document.querySelector(`tr[data-line-idx="${idx}"]`);
    if (!line || !row) return;

    line.total_qty = calculateLineTotal(line);
    const totalQtyInput = row.querySelector('.line-total-qty-input');
    if (totalQtyInput) {
        totalQtyInput.value = line.total_qty > 0 ? line.total_qty.toFixed(2) : '';
    }
}

function syncLineInputs() {
    const rows = document.querySelectorAll('tr[data-line-idx]');
    rows.forEach(row => {
        const idx = parseInt(row.dataset.lineIdx, 10);
        const line = sprayData.lines[idx];
        if (!line) return;

        const select = row.querySelector('select[data-line-idx]');
        if (select) {
            line.stock_id = select.value || null;
            const selected = select.options[select.selectedIndex];
            line.stock_description = selected?.dataset.stockDescription || line.stock_description;
            line.active_ingredient = selected ? selected.dataset.activeIngredient : line.active_ingredient;
            line.uom_id = selected?.dataset.uomId ? Number(selected.dataset.uomId) : line.uom_id || null;
            line.uom = selected?.dataset.uomCode || line.uom || '';
        }
        console.log(select ? select.value : null, line.stock_description, line.stock_id);
        const input = row.querySelector('input.line-qty-input');
        const totalInput = row.querySelector('input.line-total-qty-input');
        if (input) {
            const value = parseFloat(input.value);
            if (doseBasis === 'PER_100L') {
                line.qty_per_100l = isNaN(value) ? 0 : value;
            } else {
                line.qty_per_ha = isNaN(value) ? 0 : value;
            }
            line.total_qty = calculateLineTotal(line);
        }
        if (totalInput) {
            const value = parseFloat(totalInput.value);
            if (!Number.isNaN(value)) {
                line.total_qty = value;
                const totalWater = Number(sprayData?.header?.total_water || 0);
                const totalHa = Number(sprayData?.header?.total_ha || 0);
                if (doseBasis === 'PER_100L' && totalWater > 0) {
                    line.qty_per_100l = (value * 100) / totalWater;
                } else if (doseBasis === 'PER_HA' && totalHa > 0) {
                    line.qty_per_ha = value / totalHa;
                }
            }
        }
    });
}

function handleLineTotalQtyChange(idx) {
    const input = document.querySelector(`input.line-total-qty-input[data-line-idx="${idx}"]`);
    const line = sprayData.lines[idx];
    if (!input || !line) return;

    const totalQty = parseFloat(input.value) || 0;
    line.total_qty = totalQty;
    const totalWater = Number(sprayData?.header?.total_water || 0);
    const totalHa = Number(sprayData?.header?.total_ha || 0);
    if (doseBasis === 'PER_100L' && totalWater > 0) {
        line.qty_per_100l = (totalQty * 100) / totalWater;
    } else if (doseBasis === 'PER_HA' && totalHa > 0) {
        line.qty_per_ha = totalQty / totalHa;
    }
    const doseInput = document.querySelector(`input.line-qty-input[data-line-idx="${idx}"]`);
    if (doseInput) {
        const dose = doseBasis === 'PER_100L' ? line.qty_per_100l : line.qty_per_ha;
        doseInput.value = dose > 0 ? dose.toFixed(2) : '';
    }
    recalculateMixes();
}

function addLine() {
    syncLineInputs();
    const newLine = {
        line_id: null,
        stock_id: null,
        stock_description: '',
        active_ingredient: '',
        dose_basis: doseBasis,
        qty_per_100l: doseBasis === 'PER_100L' ? 0 : null,
        qty_per_ha: doseBasis === 'PER_HA' ? 0 : null,
        total_qty: 0,
        uom_id: null,
        uom: ''
    };
    sprayData.lines.push(newLine);

    // ensure an empty placeholder appears in the mix section too
    sprayData.mixLines = sprayData.mixLines || [];
    const firstMix = sprayData.mixLines[0] || {};
    const targetMixNumber = firstMix.mix_number != null ? Number(firstMix.mix_number) : 1;
    const placeholderIndex = sprayData.lines.length - 1;
    sprayData.mixLines.push({
        line_id: null,
        stock_id: newLine.stock_id,
        stock_description: newLine.stock_description,
        active_ingredient: newLine.active_ingredient,
        qty: newLine.total_qty,
        uom: newLine.uom,
        mix_number: targetMixNumber,
        water: firstMix.water != null ? firstMix.water : 0,
        mix_ha: firstMix.mix_ha != null ? firstMix.mix_ha : 0,
        placeholder_for_line_idx: placeholderIndex
    });

    renderLines();
    recalculateMixes();
}

function removeLine(idx) {
    syncLineInputs();
    sprayData.lines.splice(idx, 1);
    renderLines();
    recalculateMixes();
}

async function saveLinesEdit() {
    syncLineInputs();
    const payload = {
        lines: sprayData.lines.map(line => ({
            line_id: line.line_id,
            stock_id: line.stock_id,
            qty_per_100l: line.qty_per_100l,
            qty_per_ha: line.qty_per_ha,
            total_qty: line.total_qty,
            uom_id: line.uom_id
        }))
    };

    const response = await request(`/agri/spray/${sprayId}/edit_spray_lines`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const result = await response.json();

    if (!response.ok || !result.success) {
        Swal.fire({
            icon: 'error',
            title: 'Save failed',
            text: result.message || 'Failed to save spray lines.'
        });
        return;
    }

    await Swal.fire({
        icon: 'success',
        title: 'Saved',
        text: 'Spray lines saved successfully!',
        timer: 1500,
        showConfirmButton: false
    });

    editModes.lines = false;
    sprayData.lines = await fetchLines(sprayId);
    renderLines();
    await renderMix(true);
}

async function cancelLinesEdit() {
    editModes.lines = false;
    sprayData.lines = await fetchLines(sprayId);
    renderLines();
}

function syncProjectEditorState() {
    const activeMode = document.querySelector('input[name="edit-project-dose-basis"]:checked')?.value || sprayData?.header?.dose_basis || 'PER_100L';
    const activeInput = document.activeElement;
    const projectSection = document.getElementById('project-water-editor');
    const project100lSection = document.getElementById('project-global-water-editor-100l');
    const globalSection = document.getElementById('project-global-water-editor');
    if (projectSection) projectSection.style.display = activeMode === 'PER_100L' ? 'block' : 'none';
    if (project100lSection) project100lSection.style.display = activeMode === 'PER_100L' ? 'block' : 'none';
    if (globalSection) globalSection.style.display = activeMode === 'PER_HA' ? 'block' : 'none';

    if (!sprayData || !sprayData.header || !Array.isArray(sprayData.header.projects)) return;

    const totalHa = Number(sprayData.header.total_ha || 0);
    sprayData.header.dose_basis = activeMode;
    doseBasis = activeMode;

    const tankRead = readWaterPerTankInput(activeMode);
    sprayData.header.water_per_tank = tankRead.value;

    if (tankRead.input && document.getElementById('project-global-water-per-tank') &&
        document.getElementById('project-global-water-per-tank-100l')) {
        const other = activeMode === 'PER_100L'
            ? document.getElementById('project-global-water-per-tank')
            : document.getElementById('project-global-water-per-tank-100l');
        if (other && other !== tankRead.input) {
            other.value = tankRead.value != null ? String(tankRead.value) : '';
        }
    }

    if (activeMode === 'PER_100L') {
        sprayData.header.water_per_ha = null;
        sprayData.header.total_water = 0;

        sprayData.header.projects.forEach((project, index) => {
            const waterInput = document.getElementById(`project-water-ha-${index}`);
            const totalInput = document.getElementById(`project-total-water-${index}`);
            const ha = Number(project.ha || 0);
            let waterValue = waterInput ? Number(waterInput.value || 0) : Number(project.water_per_ha || 0);
            let totalValue = totalInput ? Number(totalInput.value || 0) : Number(project.total_water || 0);

            if (activeInput === waterInput && waterInput && waterInput.value !== '' && Number.isFinite(waterValue) && waterValue > 0 && ha > 0) {
                totalValue = waterValue * ha;
                if (totalInput) totalInput.value = String(totalValue);
            } else if (activeInput === totalInput && totalInput && totalInput.value !== '' && Number.isFinite(totalValue) && totalValue > 0 && ha > 0) {
                waterValue = totalValue / ha;
                if (waterInput) waterInput.value = String(waterValue);
            }

            project.water_per_ha = Number.isFinite(waterValue) && waterValue > 0 ? waterValue : (ha > 0 && Number.isFinite(totalValue) && totalValue > 0 ? totalValue / ha : null);
            project.total_water = Number.isFinite(totalValue) && totalValue > 0 ? totalValue : (ha > 0 && project.water_per_ha != null ? ha * project.water_per_ha : 0);
            sprayData.header.total_water += Number(project.total_water || 0);

            if (waterInput && document.activeElement !== waterInput) waterInput.value = project.water_per_ha != null ? String(project.water_per_ha) : '';
            if (totalInput && document.activeElement !== totalInput) totalInput.value = project.total_water != null ? String(project.total_water) : '';
        });
    } else if (activeMode === 'PER_HA') {
        const waterPerHaInput = document.getElementById('project-global-water-per-ha');
        const totalWaterInput = document.getElementById('project-global-total-water');
        let waterPerHa = waterPerHaInput ? Number(waterPerHaInput.value || 0) : Number(sprayData.header.water_per_ha || 0);
        let totalWater = totalWaterInput ? Number(totalWaterInput.value || 0) : Number(sprayData.header.total_water || 0);

        if (activeInput === waterPerHaInput && waterPerHaInput && waterPerHaInput.value !== '' && Number.isFinite(waterPerHa) && waterPerHa > 0 && totalHa > 0) {
            totalWater = waterPerHa * totalHa;
            if (totalWaterInput) totalWaterInput.value = String(totalWater);
        } else if (activeInput === totalWaterInput && totalWaterInput && totalWaterInput.value !== '' && Number.isFinite(totalWater) && totalWater > 0 && totalHa > 0) {
            waterPerHa = totalWater / totalHa;
            if (waterPerHaInput) waterPerHaInput.value = String(waterPerHa);
        }

        sprayData.header.water_per_ha = Number.isFinite(waterPerHa) && waterPerHa > 0 ? waterPerHa : (totalHa > 0 && Number.isFinite(totalWater) && totalWater > 0 ? totalWater / totalHa : null);
        sprayData.header.total_water = Number.isFinite(totalWater) && totalWater > 0 ? totalWater : (totalHa > 0 && sprayData.header.water_per_ha != null ? totalHa * sprayData.header.water_per_ha : 0);

        sprayData.header.projects.forEach((project) => {
            project.water_per_ha = null;
            project.total_water = totalHa > 0 && sprayData.header.total_water > 0 ? sprayData.header.total_water : 0;
        });

        if (waterPerHaInput && document.activeElement !== waterPerHaInput) waterPerHaInput.value = sprayData.header.water_per_ha != null ? String(sprayData.header.water_per_ha) : '';
        if (totalWaterInput && document.activeElement !== totalWaterInput) totalWaterInput.value = sprayData.header.total_water != null ? String(sprayData.header.total_water) : '';
    } else {
        sprayData.header.water_per_ha = null;
        sprayData.header.water_per_tank = null;
        sprayData.header.total_water = null;
        sprayData.header.projects.forEach((project) => {
            project.water_per_ha = null;
            project.total_water = null;
        });
    }

    syncLinePreviewQuantities(activeMode);

    window.clearTimeout(window.projectSyncTimer);
    window.projectSyncTimer = window.setTimeout(() => {
        renderLines();
        recalculateMixes();
    }, 0);
}

function readWaterPerTankInput(activeMode) {
    const perHaInput = document.getElementById('project-global-water-per-tank');
    const per100Input = document.getElementById('project-global-water-per-tank-100l');
    const input = activeMode === 'PER_100L'
        ? (per100Input || perHaInput)
        : (perHaInput || per100Input);
    if (!input || input.value === '') return { input: input || null, value: null };
    const value = Number(input.value);
    return {
        input: input,
        value: Number.isFinite(value) && value > 0 ? value : null
    };
}

function currentDoseBasis() {
    return (sprayData && sprayData.header && sprayData.header.dose_basis) || doseBasis || 'PER_100L';
}

function buildMixPlan(header, lines) {
    const dose = (header && header.dose_basis) || doseBasis || 'PER_100L';
    if (dose === 'PER_HA_DIRECT') return [];

    const sprayLines = (lines || []).filter(function (line) {
        return line && (line.stock_id || line.stock_description);
    });

    const totalWater = Number(header && header.total_water != null ? header.total_water : 0);
    const totalHa = Number(header && header.total_ha != null ? header.total_ha : 0);
    let waterPerHa = Number(header && header.water_per_ha != null ? header.water_per_ha : 0);
    const waterPerTank = Number(header && header.water_per_tank != null ? header.water_per_tank : 0);
    if (!(waterPerHa > 0) && totalHa > 0 && totalWater > 0) {
        waterPerHa = totalWater / totalHa;
    }

    const tanks = [];
    const maxMixes = 50;

    if (dose === 'PER_100L') {
        if (totalWater <= 0) {
            tanks.push({ mix_number: 1, water: 0, mix_ha: totalHa || 0 });
        } else {
            const tank = waterPerTank > 0 ? waterPerTank : totalWater;
            let remaining = totalWater;
            let n = 1;
            while (remaining > 1e-9 && n <= maxMixes) {
                let mixWater = Math.min(tank, remaining);
                if (n === maxMixes) mixWater = remaining;
                const mixHa = totalWater > 0 ? (totalHa * mixWater / totalWater) : 0;
                tanks.push({ mix_number: n, water: mixWater, mix_ha: mixHa });
                remaining = Math.round((remaining - mixWater) * 1e6) / 1e6;
                n += 1;
            }
        }
    } else if (dose === 'PER_HA') {
        if (totalHa <= 0) {
            tanks.push({ mix_number: 1, water: totalWater || 0, mix_ha: 0 });
        } else {
            let haPerTank = totalHa;
            if (waterPerTank > 0 && waterPerHa > 0) haPerTank = waterPerTank / waterPerHa;
            else if (waterPerTank > 0 && totalWater > 0) haPerTank = totalHa * (waterPerTank / totalWater);

            let remainingHa = totalHa;
            let n = 1;
            while (remainingHa > 1e-9 && n <= maxMixes) {
                let mixHa = Math.min(haPerTank, remainingHa);
                if (n === maxMixes) mixHa = remainingHa;
                const mixWater = waterPerHa > 0
                    ? waterPerHa * mixHa
                    : (totalHa > 0 ? totalWater * mixHa / totalHa : 0);
                tanks.push({ mix_number: n, water: mixWater, mix_ha: mixHa });
                remainingHa = Math.round((remainingHa - mixHa) * 1e6) / 1e6;
                n += 1;
            }
        }
    }

    const mixLines = [];
    tanks.forEach(function (tank) {
        sprayLines.forEach(function (line, idx) {
            const qtyPerHa = Number(line.qty_per_ha || 0);
            const qtyPer100L = Number(line.qty_per_100l || 0);
            let qty = 0;
            if (dose === 'PER_HA') qty = qtyPerHa * tank.mix_ha;
            else if (dose === 'PER_100L') qty = (qtyPer100L / 100) * tank.water;
            else qty = Number(line.total_qty || 0);

            mixLines.push({
                line_id: null,
                stock_id: line.stock_id,
                stock_description: line.stock_description,
                active_ingredient: line.active_ingredient,
                qty: qty,
                uom: line.uom || '',
                uom_id: line.uom_id == null ? null : line.uom_id,
                mix_number: tank.mix_number,
                water: tank.water,
                mix_ha: tank.mix_ha,
                placeholder_for_line_idx: idx
            });
        });
    });
    return mixLines;
}

function recalculateMixes() {
    sprayData = sprayData || {};
    const activeDoseBasis = currentDoseBasis();
    doseBasis = activeDoseBasis;
    if (activeDoseBasis === 'PER_HA_DIRECT') {
        sprayData.mixLines = [];
        renderMix();
        return;
    }
    sprayData.mixLines = buildMixPlan(sprayData.header || {}, sprayData.lines || []);
    renderMix();
}

function calculateLineTotal(line) {
    const activeDoseBasis = currentDoseBasis();
    const quantity = activeDoseBasis === 'PER_100L'
        ? Number(line.qty_per_100l || 0)
        : Number(line.qty_per_ha || 0);
    const totalWater = Number(sprayData && sprayData.header ? sprayData.header.total_water || 0 : 0);
    const totalHa = Number(sprayData && sprayData.header ? sprayData.header.total_ha || 0 : 0);
    if (activeDoseBasis === 'PER_100L') {
        return totalWater > 0 ? (quantity / 100) * totalWater : 0;
    }
    if (activeDoseBasis === 'PER_HA' || activeDoseBasis === 'PER_HA_DIRECT') {
        return totalHa > 0 ? quantity * totalHa : Number(line.total_qty || 0);
    }
    return Number(line.total_qty || 0);
}

async function renderMix(forceFetch = false) {
    sprayData = sprayData || {};
    const mixContainer = document.getElementById("spray-mixes");
    if (!mixContainer) return;

    const isEditingMixInputs = editModes.projects || editModes.lines;

    if (forceFetch || (!isEditingMixInputs && !sprayData.mixLines)) {
        try {
            const fetched = await fetchMixLines(sprayId);
            sprayData.mixLines = Array.isArray(fetched) ? fetched : [];
        } catch (err) {
            console.error(err);
            sprayData.mixLines = [];
        }
    } else if (isEditingMixInputs) {
        sprayData.mixLines = buildMixPlan(sprayData.header || {}, sprayData.lines || []);
    }

    const lines = sprayData.mixLines || [];
    if (currentDoseBasis() === 'PER_HA_DIRECT') {
        mixContainer.innerHTML = `
            <div class="section-card">
                <div class="section-header"><span>Mix Plan</span></div>
                <div class="section-body"><div class='no-data'>Direct per hectare — no tank mix is required.</div></div>
            </div>
        `;
        return;
    }

    if (!lines.length) {
        mixContainer.innerHTML = `
            <div class="section-card">
                <div class="section-header"><span>Mix Plan</span></div>
                <div class="section-body"><div class='no-data'>Add products and water settings to build a mix plan.</div></div>
            </div>
        `;
        return;
    }

    const mixGroups = {};
    lines.forEach(function (line) {
        const mixNo = line.mix_number != null ? String(line.mix_number) : '1';
        if (!mixGroups[mixNo]) mixGroups[mixNo] = [];
        mixGroups[mixNo].push(line);
    });

    let html = `
        <div class="section-card">
            <div class="section-header">
                <span>Mix Plan</span>
                <span>${Object.keys(mixGroups).length} mix${Object.keys(mixGroups).length === 1 ? '' : 'es'}</span>
            </div>
            <div class="section-body">
                <div class="mix-plan-list">
    `;

    Object.keys(mixGroups).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (mixNo) {
        const mixLines = mixGroups[mixNo];
        const firstLine = mixLines[0] || {};
        const waterValue = Number(firstLine.water);
        const mixHaValue = Number(firstLine.mix_ha);
        const waterDisplay = Number.isFinite(waterValue) ? waterValue.toFixed(2) + ' L Water' : '-';
        const mixHaDisplay = Number.isFinite(mixHaValue) ? mixHaValue.toFixed(2) + ' Ha' : '-';
        const productItems = mixLines.map(function (line) {
            const qtyValue = Number(line.qty);
            const qtyDisplay = Number.isFinite(qtyValue) ? qtyValue.toFixed(2) : '-';
            return `
                <div class="mix-plan-row">
                    <span>${escapeHtml(line.stock_description || '-')}</span>
                    <strong>${qtyDisplay} ${escapeHtml(line.uom || '')}</strong>
                </div>
            `;
        }).join('');

        html += `
            <div class="mix-plan-item">
                <div class="mix-plan-header">
                    <span>Mix ${escapeHtml(mixNo)}</span>
                    <span class="mix-plan-meta">${waterDisplay} • ${mixHaDisplay}</span>
                </div>
                <div class="mix-plan-rows">${productItems}</div>
            </div>
        `;
    });

    html += `
                </div>
            </div>
        </div>
    `;
    mixContainer.innerHTML = html;
}

function saveProjectsEdit() {
    syncProjectEditorState();
    recalculateMixes();

    const groupedMixes = {};
    (sprayData && sprayData.mixLines || []).forEach(function (line) {
        const mixNumber = line.mix_number != null ? Number(line.mix_number) : 1;
        if (!groupedMixes[mixNumber]) {
            groupedMixes[mixNumber] = {
                mix_number: mixNumber,
                mix_water: line.water != null ? Number(line.water) : 0,
                mix_ha: line.mix_ha != null ? Number(line.mix_ha) : 0,
                lines: []
            };
        }
        groupedMixes[mixNumber].lines.push({
            stock_id: line.stock_id,
            qty: line.qty != null ? Number(line.qty) : 0,
            uom_id: line.uom_id != null ? Number(line.uom_id) : null
        });
    });

    const payload = {
        dose_basis: sprayData && sprayData.header ? sprayData.header.dose_basis : 'PER_100L',
        total_ha: sprayData && sprayData.header ? sprayData.header.total_ha : null,
        total_water: sprayData && sprayData.header ? sprayData.header.total_water : null,
        water_per_ha: sprayData && sprayData.header ? sprayData.header.water_per_ha : null,
        water_per_tank: sprayData && sprayData.header ? sprayData.header.water_per_tank : null,
        projects: ((sprayData && sprayData.header && sprayData.header.projects) || []).map(function (project) {
            return {
                project_id: project.project_id,
                project_code: project.project_code,
                water_per_ha: project.water_per_ha,
                total_water: project.total_water
            };
        }),
        lines: (sprayData && sprayData.lines || []).map(function (line) {
            return {
                line_id: line.line_id,
                stock_id: line.stock_id,
                qty_per_100l: line.qty_per_100l,
                qty_per_ha: line.qty_per_ha,
                total_qty: line.total_qty,
                uom_id: line.uom_id
            };
        }),
        mixes: Object.keys(groupedMixes).sort(function (a, b) { return Number(a) - Number(b); }).map(function (mixNumber) {
            return groupedMixes[mixNumber];
        })
    };

    request(`/agri/spray/${sprayId}/edit_spray_projects`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(function (response) { return response.json(); })
    .then(async function (result) {
        if (!result.success) {
            await Swal.fire({ icon: 'error', title: 'Project save failed', text: result.message || 'Failed to save project settings.' });
            return;
        }
        await Swal.fire({ icon: 'success', title: 'Saved', text: 'Project settings saved.', timer: 1200, showConfirmButton: false });
        editModes.projects = false;
        await renderHeader();
        await renderLines();
        await renderMix(true);
    })
    .catch(async function (err) {
        await Swal.fire({ icon: 'error', title: 'Network error', text: err.message });
    });
}

function cancelProjectsEdit() {
    editModes.projects = false;
    renderHeader();
}

function toggleHeaderWaterFields() {
    const selectedDoseBasis = document.querySelector('input[name="edit-dose-basis"]:checked')?.value || 'PER_100L';
    const per100l = document.getElementById('project-water-editor');
    const perHa = document.getElementById('global-water-editor');
    if (per100l) per100l.style.display = selectedDoseBasis === 'PER_100L' ? 'block' : 'none';
    if (perHa) perHa.style.display = selectedDoseBasis === 'PER_HA' ? 'block' : 'none';
    if (selectedDoseBasis === 'PER_HA_DIRECT') {
        if (per100l) per100l.style.display = 'none';
        if (perHa) perHa.style.display = 'none';
    }
}

function updateWeekNo() {
    const dateInput = document.getElementById('edit-date');
    if (!dateInput.value) return;
    const date = new Date(dateInput.value);
    const weekNo = getWeekNumber(date);
    const year = date.getFullYear();
    document.getElementById('edit-week').value = `${year}-${String(weekNo).padStart(2, '0')}`;
}

function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

let lastPreviewDose = null;

function formatQty(value) {
    const amount = Number(value);
    return Number.isFinite(amount) ? amount.toFixed(2) : '-';
}

function syncLinePreviewQuantities(activeMode) {
    if (!sprayData || !Array.isArray(sprayData.lines)) return;

    const totalWater = Number(sprayData.header && sprayData.header.total_water || 0);
    const totalHa = Number(sprayData.header && sprayData.header.total_ha || 0);
    const previous = lastPreviewDose || (sprayData.header && sprayData.header.dose_basis) || activeMode;

    sprayData.lines.forEach(function (line) {
        const rate100 = Number(line.qty_per_100l);
        const rateHa = Number(line.qty_per_ha);
        let total = Number(line.total_qty);
        if (!Number.isFinite(total) || total < 0) total = 0;

        // First recover a product total from the mode we were just using.
        if (previous === 'PER_100L' && rate100 > 0 && totalWater > 0) {
            total = (rate100 / 100) * totalWater;
        } else if ((previous === 'PER_HA' || previous === 'PER_HA_DIRECT') && rateHa > 0 && totalHa > 0) {
            total = rateHa * totalHa;
        } else if (!(total > 0)) {
            if (rate100 > 0 && totalWater > 0) total = (rate100 / 100) * totalWater;
            else if (rateHa > 0 && totalHa > 0) total = rateHa * totalHa;
        }

        if (activeMode === 'PER_100L') {
            if (previous === 'PER_100L' && rate100 > 0) {
                // Same mode: keep the /100L rate, follow new water.
                total = totalWater > 0 ? (rate100 / 100) * totalWater : total;
                line.qty_per_100l = rate100;
            } else {
                // Switched into 100L: keep product total, derive /100L.
                line.qty_per_100l = totalWater > 0 ? (total / totalWater) * 100 : 0;
            }
            line.total_qty = total;
            line.qty_per_ha = totalHa > 0 ? total / totalHa : line.qty_per_ha;
        } else {
            if ((previous === 'PER_HA' || previous === 'PER_HA_DIRECT') && rateHa > 0) {
                // Same mode: keep the /ha rate, follow hectares.
                total = totalHa > 0 ? rateHa * totalHa : total;
                line.qty_per_ha = rateHa;
            } else {
                // Switched into per-ha: keep product total, derive /ha.
                line.qty_per_ha = totalHa > 0 ? total / totalHa : 0;
            }
            line.total_qty = total;
            line.qty_per_100l = totalWater > 0 ? (total / totalWater) * 100 : line.qty_per_100l;
        }
        line.dose_basis = activeMode;
    });

    lastPreviewDose = activeMode;
}

async function renderLines() {
    sprayData = sprayData || {};
    let lines;

    // Keep in-memory preview rows while editing projects or lines.
    const useLocalLines = (editModes.lines || editModes.projects) && Array.isArray(sprayData.lines) && sprayData.lines.length;
    if (useLocalLines) {
        lines = sprayData.lines;
    } else {
        const linesData = await fetchLines(sprayId);
        if (!linesData.success) {
            document.getElementById("spray-lines").innerHTML =
                `<div class='no-data'>Error loading spray lines: ${linesData.message || 'Unknown error'}</div>`;
            return;
        }
        sprayData.lines = linesData.lines;
        lines = sprayData.lines;
        lastPreviewDose = (sprayData.header && sprayData.header.dose_basis) || doseBasis;
    }

    if (!lines || lines.length === 0) {
        document.getElementById("spray-lines").innerHTML = "<div class='no-data'>No spray lines found.</div>";
        return;
    }

    const activeDose = currentDoseBasis();
    const qtyColumnText = activeDose === 'PER_100L' ? "Qty / 100L" : "Qty / Ha";
    const editModeClass = editModes.lines ? 'edit-mode' : '';
    let productOptions = [];
    if (editModes.lines) {
        productOptions = await fetchProductsOptions(sprayId);
    }

    const productHeader = editModes.lines
        ? '<th colspan="2">Product</th>'
        : '<th>Stock Description</th><th>Active Ingredient</th>';

    let html = `
        <div class="section-card">
            <div class="section-header ${editModeClass}">
                <span>Spray Products</span>
                <div>
                    ${editModes.lines
                        ? `<button class="save-btn" onclick="saveLinesEdit()">Save</button><button class="cancel-btn" onclick="cancelLinesEdit()">Cancel</button><button class="add-btn" onclick="addLine()">Add Line</button>`
                        : (sprayData.header && sprayData.header.issues_exist || !canEdit ? '' : `<button class="edit-btn" onclick="toggleEditMode('lines')">Edit</button>`)}
                </div>
            </div>
            <div class="section-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                ${productHeader}
                                <th>${qtyColumnText}</th>
                                <th>Total Qty</th>
                                ${editModes.lines ? '<th></th>' : ''}
                            </tr>
                        </thead>
                        <tbody id="lines-tbody">
    `;

    lines.forEach(function (line, idx) {
        const qty = activeDose === 'PER_100L' ? line.qty_per_100l : line.qty_per_ha;
        const qtyDisplay = qty == null || qty === '' ? '' : formatQty(qty);
        const totalQtyDisplay = line.total_qty == null || line.total_qty === '' ? '' : formatQty(line.total_qty);

        if (editModes.lines) {
            const options = productOptions.map(function (product) {
                const ai = escapeHtml(product.active_ingredient || '');
                const desc = escapeHtml(product.stock_description || '');
                const qtyOnHand = product.qty_on_hand !== null ? parseFloat(product.qty_on_hand).toFixed(2) : '0.00';
                const unit = product.stocking_uom_code || '';
                return `<option value="${product.stock_link}" ${product.stock_link === parseInt(line.stock_id, 10) ? 'selected' : ''} data-active-ingredient="${ai}" data-stock-description="${desc}" data-uom-id="${product.stocking_uom_id || ''}" data-uom-code="${escapeHtml(unit)}">${ai} - ${desc} (Available: ${qtyOnHand} ${unit})</option>`;
            }).join('');
            html += `
                <tr data-line-idx="${idx}">
                    <td colspan="2">
                        <select class="line-product-select" data-line-idx="${idx}" onchange="handleLineProductChange(${idx})">
                            <option value="">Select product</option>
                            ${options}
                        </select>
                    </td>
                    <td><input type="number" class="line-qty-input" data-line-idx="${idx}" value="${qtyDisplay}" step="0.01" oninput="handleLineQtyChange(${idx})"></td>
                    <td><input type="number" class="line-total-qty-input" data-line-idx="${idx}" value="${totalQtyDisplay}" step="0.01" oninput="handleLineTotalQtyChange(${idx})"></td>
                    <td><button class="remove-btn" onclick="removeLine(${idx})">Remove</button></td>
                </tr>
            `;
        } else {
            html += `
                <tr>
                    <td>${escapeHtml(line.stock_description || '-')}</td>
                    <td>${escapeHtml(line.active_ingredient || '-')}</td>
                    <td>${qty != null && qty !== '' ? `${formatQty(qty)} ${escapeHtml(line.uom || '')}` : '-'}</td>
                    <td>${totalQtyDisplay}</td>
                </tr>
            `;
        }
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    document.getElementById("spray-lines").innerHTML = html;
    if (editModes.lines) {
        initLineSelects();
    }
    await renderMix();
}

function toggleEditMode(section) {
    editModes[section] = !editModes[section];
    if (section === 'projects' && editModes.projects) {
        lastPreviewDose = (sprayData && sprayData.header && sprayData.header.dose_basis) || doseBasis;
    }
    if (section === 'header' || section === 'projects') {
        renderHeader();
    } else if (section === 'lines') {
        renderLines();
    }
}

function saveHeaderEdit() {
    const description = document.getElementById('edit-description').value;
    const date = document.getElementById('edit-date').value;
    const week = document.getElementById('edit-week').value;
    const scouting = document.getElementById('edit-scouting').value;
    const weather = document.getElementById('edit-weather')?.value || '';
    const startTime = document.getElementById('edit-start-time')?.value || null;
    const endTime = document.getElementById('edit-end-time')?.value || null;
    const methodId = document.getElementById('edit-method-id')?.value || sprayData?.header?.method_id || null;
    const payload = {
        spray_description: description,
        spray_date: date,
        spray_week: week,
        scouting: scouting,
        weather: weather,
        start_datetime: startTime,
        end_datetime: endTime,
        method_id: methodId
    };

    request(`/agri/spray/${sprayId}/edit_spray_header`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(async result => {
        if (!result.success) {
            await Swal.fire({
                icon: 'error',
                title: 'Save failed',
                text: result.message || 'Failed to save header changes.'
            });
            return;
        }
        await Swal.fire({
            icon: 'success',
            title: 'Saved',
            text: 'Header changes saved successfully!',
            timer: 1500,
            showConfirmButton: false
        });
        sprayData.header.spray_description = description;
        sprayData.header.spray_date = date;
        sprayData.header.spray_week = week;
        sprayData.header.scouting = scouting;
        sprayData.header.weather = weather;
        sprayData.header.start_datetime = startTime;
        sprayData.header.end_datetime = endTime;
        sprayData.header.method_id = methodId;
        editModes.header = false;
        await renderHeader();
        await renderLines();
    })
    .catch(async err => {
        await Swal.fire({
            icon: 'error',
            title: 'Network error',
            text: err.message
        });
    });
}

function cancelInlineEdit() {
    editModes.header = false;
    renderHeader();
}

async function cancelRecommendation() {
    const confirmation = await Swal.fire({
        icon: 'warning',
        title: 'Cancel recommendation?',
        text: 'This cannot be undone.',
        showCancelButton: true,
        confirmButtonText: 'Yes, cancel it',
        cancelButtonText: 'No, keep it'
    });
    if (!confirmation.isConfirmed) {
        return;
    }

    request(`/agri/spray/${sprayId}/cancel`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(async result => {
        if (!result.success) {
            await Swal.fire({
                icon: 'error',
                title: 'Cancellation failed',
                text: result.message || 'Failed to cancel spray recommendation.'
            });
            return;
        }
        await Swal.fire({
            icon: 'success',
            title: 'Cancelled',
            text: 'Spray recommendation cancelled.',
            timer: 1500,
            showConfirmButton: false
        });
        sprayData.header.status = 'CANCELLED';
        renderHeader();
    })
    .catch(async err => {
        await Swal.fire({
            icon: 'error',
            title: 'Network error',
            text: err.message
        });
    });
}

function printInstruction() {
    window.open(`/agri/instruction/${sprayId}/instruction_pdf`, '_blank');
}

function cancelHeaderEdit() {
    editModes.header = false;
    renderHeader();
}

function handleLineQtyChange(idx) {
    const input = document.querySelector(`input[data-line-idx="${idx}"]`);
    const newQty = parseFloat(input.value) || 0;
    const line = sprayData.lines[idx];
    
    // Update line data
    if (doseBasis === 'PER_100L') {
        line.qty_per_100l = newQty;
    } else {
        line.qty_per_ha = newQty;
    }
    
    updateLineTotal(idx);
    
    // Recalculate mixes
    recalculateMixes();
}


function openExecution(executionId) {
    // Navigate to the execution view for this execution
    if (!executionId) return;
    window.location.href = `/agri/execution/${executionId}`;
}

</script>
