<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup Incomplete</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='color-template.css') }}">
</head>
<body>
<main class="account-status-page">
    <section class="status-card">
        <div class="status-icon">⚠️</div>
        <h1>Account setup incomplete</h1>
        <p class="status-text">
            Your account <strong>{{ current_user.username }}</strong> is not fully configured yet.
            Please try again or log out and sign in again.
        </p>
        <div class="status-actions">
            <button type="button" class="secondary-btn" onclick="window.location.reload()">Retry</button>
            <a href="{{ url_for('logout') }}" class="primary-btn">Logout</a>
        </div>
    </section>
</main>

<style>
.account-status-page {
    padding: 2rem 1rem;
    max-width: 560px;
    margin: 0 auto;
}

.status-card {
    background: #fff;
    border: 1px solid rgba(37, 99, 235, 0.12);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    text-align: center;
}

.status-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.status-card h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #1f2937;
}

.status-text {
    margin: 1rem 0 2rem;
    color: #475569;
    line-height: 1.7;
}

.status-actions {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
}

.primary-btn,
.secondary-btn {
    border: none;
    border-radius: 999px;
    padding: 0.95rem 1.4rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.primary-btn {
    background: #2563eb;
    color: #ffffff;
}

.secondary-btn {
    background: #eef2ff;
    color: #2563eb;
}

@media (max-width: 520px) {
    .status-card {
        padding: 1.5rem;
    }
    .status-actions {
        flex-direction: column;
    }
    .primary-btn,
    .secondary-btn {
        width: 100%;
    }
}
</style>
</body>
