<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" href="">
</head>
<body>
<style>
    @import url("{{ url_for('static', filename='color-template.css') }}");
    body {
        font-family: Arial, sans-serif;
        background-color: var(--primary-bg);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px 0;
        box-sizing: border-box;
    }

    .login-container {
        background-color: var(--container-bg);
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 24px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-sizing: border-box;
    }

    .login-logo {
        max-height: 140px;
        width: auto;
        margin-bottom: 10px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 24px;
        color: var(--primary-text);
    }

    form {
        display: flex;
        flex-direction: column;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    label {
        font-size: 14px;
        color: var(--primary-text);
        margin-bottom: 5px;
        display: block;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        outline: none;
        border-color: var(--button-bg);
    }

    button {
        background-color: var(--button-bg);
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        padding: 12px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin: 10px 0;
    }

    button:hover {
        background-color: var(--button-hover);
    }

    .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @media (max-width: 480px) {
        body { padding: 12px 8px; }
        .login-container { padding: 16px; margin: 0 8px; }
        .login-logo { max-height: 100px; }
        h2 { font-size: 20px; }
        button { padding: 10px; font-size: 15px; }
    }
</style>

<div class="page-container">
    <img src="{{ url_for('static', filename='icons/LogoAndText.svg') }}" alt="Fermesync Logo" class="login-logo">
    <div class="login-container">
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <h2>Login</h2>
        <form id="login-form" method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group" id="confirm-password-group" style="display: {{ 'block' if first_time else 'none' }};">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm_password" {% if first_time %}required{% endif %}>
            </div>
            <div class="form-group" id="login-helper" style="font-size:0.95rem;color:#555;margin-bottom:0.75rem;">
                {% if first_time %}
                    Create a password for your first login.
                {% endif %}
            </div>
            <input type="hidden" name="next" value="{{ next or request.args.get('next') }}">
            <button type="submit">Login</button>
        </form>

        <script>
    document.addEventListener('DOMContentLoaded', function () {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmGroup = document.getElementById('confirm-password-group');
        const confirmInput = document.getElementById('confirm-password');
        const loginHelper = document.getElementById('login-helper');

        const resetHelper = () => {
            confirmGroup.style.display = 'none';
            confirmInput.required = false;
            loginHelper.textContent = '';
        };

        usernameInput.addEventListener('input', function () {
            if (!this.value.trim()) {
                resetHelper();
                return;
            }
            loginHelper.textContent = '';
        });

        usernameInput.addEventListener('blur', async function () {
            const username = this.value.trim();
            if (!username) {
                resetHelper();
                return;
            }

            try {
                const response = await fetch('/login/check_username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await response.json();
                if (data.success) {
                    if (data.has_password) {
                        confirmGroup.style.display = 'none';
                        confirmInput.required = false;
                        loginHelper.textContent = 'Enter your password to log in.';
                    } else {
                        confirmGroup.style.display = 'block';
                        confirmInput.required = true;
                        loginHelper.textContent = 'First-time login: create a password.';
                    }
                } else {
                    confirmGroup.style.display = 'none';
                    confirmInput.required = false;
                    loginHelper.textContent = data.message || 'Username not found.';
                }
            } catch (err) {
                confirmGroup.style.display = 'none';
                confirmInput.required = false;
                loginHelper.textContent = 'Unable to verify username right now.';
            }
        });
    });
</script>
    </div>
</div>

</body>
</html>
